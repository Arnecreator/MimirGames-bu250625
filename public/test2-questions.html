
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test2 – Question Admin View</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0b1e;
            color: white;
            margin: 0;
            padding: 8px;
            line-height: 1.4;
            font-size: 12px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .main-section {
            background: #1a1d3a;
            border-radius: 6px;
            padding: 10px 12px;
            margin: 6px 0;
            border: 1px solid #333;
        }

        h1 {
            color: #7fffd4;
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
        }

        h2 {
            color: #7fffd4;
            margin: 0 0 8px 0;
            font-size: 13px;
            font-weight: 600;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 4px;
            margin: 8px 0;
        }

        .category-btn {
            background: #252951;
            color: #7fffd4;
            border: 1px solid #333;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-btn:hover {
            background: #333669;
            border-color: #7fffd4;
        }

        .category-btn.active {
            background: #7fffd4;
            color: #000;
            font-weight: bold;
        }

        .questions-display {
            margin-top: 12px;
            font-size: 11px;
        }

        .question-entry {
            background: #111335;
            margin: 6px 0;
            padding: 8px;
            border-radius: 3px;
            border-left: 2px solid #333;
        }

        .question-text {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .answers-list {
            margin: 6px 0;
        }

        .answer-option {
            padding: 2px 6px;
            margin: 1px 0;
            border-radius: 2px;
            font-size: 10px;
        }

        .answer-correct {
            background: rgba(127, 255, 212, 0.2);
            color: #7fffd4;
            font-weight: 500;
        }

        .answer-incorrect {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }

        .question-meta {
            font-size: 9px;
            color: #666;
            margin-top: 6px;
        }

        .loading-message {
            color: #7fffd4;
            text-align: center;
            padding: 15px;
            font-style: italic;
            font-size: 11px;
        }

        .muted-text {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 8px;
            padding: 15px;
            font-style: italic;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                padding: 4px;
                font-size: 11px;
            }

            .category-buttons {
                grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
                gap: 3px;
            }

            .category-btn {
                padding: 3px 4px;
                font-size: 9px;
                min-height: 18px;
            }

            .main-section {
                padding: 8px 10px;
                margin: 4px 0;
            }

            .question-entry {
                padding: 6px;
                margin: 4px 0;
            }

            .question-text {
                font-size: 10px;
            }

            .answer-option {
                font-size: 9px;
                padding: 2px 4px;
            }

            .question-meta {
                font-size: 8px;
            }

            h1 {
                font-size: 13px;
            }

            h2 {
                font-size: 12px;
            }

            .loading-message,
            .muted-text {
                font-size: 10px;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 3px;
                font-size: 10px;
            }

            .category-buttons {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
            }

            .category-btn {
                padding: 3px 2px;
                font-size: 8px;
                min-height: 16px;
            }

            .main-section {
                padding: 6px 8px;
            }

            .question-entry {
                padding: 5px;
            }

            .question-text {
                font-size: 9px;
            }

            .answer-option {
                font-size: 8px;
                padding: 1px 3px;
            }

            h1 {
                font-size: 12px;
                margin: 0 0 8px 0;
            }

            h2 {
                font-size: 11px;
                margin: 0 0 6px 0;
            }
        }

        /* Ultra-compact for very small screens */
        @media (max-width: 360px) {
            .category-buttons {
                grid-template-columns: repeat(2, 1fr);
            }

            .category-btn {
                font-size: 7px;
                padding: 2px;
                min-height: 14px;
            }

            .main-section {
                padding: 4px 6px;
            }

            .question-entry {
                padding: 4px;
            }

            .question-text {
                font-size: 8px;
            }

            .answer-option {
                font-size: 7px;
                padding: 1px 2px;
            }

            .question-meta {
                font-size: 7px;
            }
        }
    </style>
</head>

<body>
    <!-- Shared Topbar -->
    <div id="topbar-placeholder"></div>
    <script>
        fetch("/components/topbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("topbar-placeholder").innerHTML = html;
            });
    </script>

    <div class="container">
        <h1>📂 Question Admin View</h1>

        <div class="main-section">
            <h2>View Questions by Category</h2>
            <div class="category-buttons">
                <button class="category-btn" data-category="all">All</button>
                <button class="category-btn" data-category="History">History</button>
                <button class="category-btn" data-category="Science">Science</button>
                <button class="category-btn" data-category="Sports">Sports</button>
                <button class="category-btn" data-category="Geography">Geography</button>
                <button class="category-btn" data-category="Literature">Literature</button>
                <button class="category-btn" data-category="Math">Math</button>
                <button class="category-btn" data-category="Movies">Movies</button>
                <button class="category-btn" data-category="Music">Music</button>
                <button class="category-btn" data-category="Art">Art</button>
                <button class="category-btn" data-category="Technology">Technology</button>
                <button class="category-btn" data-category="Food">Food</button>
                <button class="category-btn" data-category="Misc">Misc</button>
            </div>
            <div id="categoryQuestionsResult">
                <p class="muted-text">Select a category above to view questions.</p>
            </div>
        </div>
    </div>

    <script src="scripts/questionManager.js"></script>
    <script src="scripts/test-questions.js"></script>
</body>
</html>

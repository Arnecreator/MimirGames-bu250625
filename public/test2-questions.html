<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test2 – Question Admin View</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0b1e;
            color: white;
            margin: 0;
            padding: 10px 20px;
            line-height: 1.6;
        }

        .main-section {
            background: #1a1d3a;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #333;
        }

        h1 {
            color: #7fffd4;
            margin: 10px 0 15px 0;
            font-size: 18px;
        }

        h2 {
            color: #7fffd4;
            margin: 10px 0;
            font-size: 16px;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .category-btn {
            background: #252951;
            color: #7fffd4;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-btn:hover {
            background: #333669;
            border-color: #7fffd4;
        }

        .category-btn.active {
            background: #7fffd4;
            color: #000;
            font-weight: bold;
        }

        .questions-display {
            margin-top: 20px;
            font-size: 13px;
        }

        .question-entry {
            background: #111335;
            margin: 8px 0;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #333;
        }

        .question-text {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .answers-list {
            margin: 8px 0;
        }

        .answer-option {
            padding: 3px 8px;
            margin: 2px 0;
            border-radius: 3px;
            font-size: 12px;
        }

        .answer-correct {
            background: rgba(127, 255, 212, 0.2);
            color: #7fffd4;
            font-weight: 500;
        }

        .answer-incorrect {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }

        .question-meta {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
        }

        .loading-message {
            color: #7fffd4;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }

        .muted-text {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            margin-top: 1em;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <!-- Shared Topbar -->
    <div id="topbar-placeholder"></div>
    <script>
        fetch("/components/topbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("topbar-placeholder").innerHTML = html;
            });
    </script>

    <h1>📂 Question Admin View</h1>

    <div class="main-section">
        <h2>View Questions by Category</h2>
        <div class="category-buttons">
            <button class="category-btn" data-category="all">All</button>
            <button class="category-btn" data-category="History">History</button>
            <button class="category-btn" data-category="Science">Science</button>
            <button class="category-btn" data-category="Sports">Sports</button>
            <button class="category-btn" data-category="Geography">Geography</button>
            <button class="category-btn" data-category="Literature">Literature</button>
            <button class="category-btn" data-category="Math">Math</button>
            <button class="category-btn" data-category="Movies">Movies</button>
            <button class="category-btn" data-category="Music">Music</button>
            <button class="category-btn" data-category="Art">Art</button>
            <button class="category-btn" data-category="Technology">Technology</button>
            <button class="category-btn" data-category="Food">Food</button>
            <button class="category-btn" data-category="Misc">Misc</button>
        </div>
        <div id="categoryQuestionsResult">
            <p class="muted-text">Select a category above to view questions.</p>
        </div>
    </div>

    <script src="scripts/questionManager.js"></script>
    <script src="scripts/test-questions.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Tools – Question Management</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0b1e;
            color: white;
            margin: 0;
            padding: 8px;
            line-height: 1.3;
            font-size: 12px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .tool-section {
            background: #1a1d3a;
            border-radius: 6px;
            padding: 8px 10px;
            margin: 6px 0;
            border: 1px solid #333;
        }

        .section-title {
            color: #7fffd4;
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 4px;
            margin-top: 6px;
        }

        .btn-sm {
            background: #7fffd4;
            color: #000;
            border: none;
            padding: 4px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
            font-size: 10px;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.2;
            min-height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-sm:hover {
            background: #5fb3a3;
            transform: translateY(-1px);
        }

        .btn-sm.btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-sm.btn-warning:hover {
            background: #e68900;
        }

        .btn-sm.btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-sm.btn-danger:hover {
            background: #ff3838;
        }

        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4caf50;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            font-weight: 500;
            max-width: 250px;
            font-size: 11px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.error {
            background: #ff4757;
        }

        .toast.warning {
            background: #ff9800;
        }

        .loading-indicator {
            display: none;
            color: #7fffd4;
            font-style: italic;
            margin-top: 4px;
            font-size: 10px;
        }

        .results-section {
            background: #111335;
            border-radius: 4px;
            padding: 6px;
            margin-top: 6px;
            border: 1px solid #333;
        }

        .results-section h3 {
            color: #7fffd4;
            margin: 0 0 4px 0;
            font-size: 11px;
        }

        .results-content {
            color: #ccc;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            max-height: 80px;
            overflow-y: auto;
        }

        h1 {
            color: #7fffd4;
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
        }

        .confirm-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 10px;
        }

        .confirm-content {
            background: #1a1d3a;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px;
            max-width: 350px;
            text-align: center;
            width: 100%;
        }

        .confirm-title {
            color: #ff9800;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .confirm-message {
            color: #ccc;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .confirm-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .confirm-btn.confirm {
            background: #ff4757;
            color: white;
        }

        .confirm-btn.confirm:hover {
            background: #ff3838;
        }

        .confirm-btn.cancel {
            background: #666;
            color: white;
        }

        .confirm-btn.cancel:hover {
            background: #777;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                padding: 4px;
                font-size: 11px;
            }

            .button-grid {
                grid-template-columns: 1fr 1fr;
                gap: 3px;
            }
            
            .toast {
                right: 4px;
                left: 4px;
                max-width: none;
                font-size: 10px;
            }

            .btn-sm {
                font-size: 9px;
                padding: 3px 5px;
                min-height: 20px;
            }

            .tool-section {
                padding: 6px 8px;
                margin: 4px 0;
            }

            .confirm-content {
                padding: 12px;
                margin: 0 5px;
            }

            .confirm-title {
                font-size: 13px;
            }

            .confirm-message {
                font-size: 11px;
            }

            .confirm-btn {
                padding: 4px 10px;
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .button-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 3px;
                font-size: 10px;
            }

            .btn-sm {
                font-size: 9px;
                padding: 3px 4px;
                min-height: 18px;
            }

            .section-title {
                font-size: 11px;
            }

            h1 {
                font-size: 13px;
            }
        }

        /* Ultra-compact for very small screens */
        @media (max-width: 360px) {
            .tool-section {
                padding: 4px 6px;
            }

            .btn-sm {
                font-size: 8px;
                padding: 2px 4px;
                min-height: 16px;
            }

            .section-title {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <!-- Confirmation dialog -->
    <div id="confirmDialog" class="confirm-dialog">
        <div class="confirm-content">
            <div class="confirm-title" id="confirmTitle">⚠️ Confirm Action</div>
            <div class="confirm-message" id="confirmMessage">Are you sure you want to proceed?</div>
            <div class="confirm-buttons">
                <button class="confirm-btn confirm" id="confirmYes">Yes, Proceed</button>
                <button class="confirm-btn cancel" id="confirmNo">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Shared Topbar -->
    <div id="topbar-placeholder"></div>
    <script>
        fetch("/components/topbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("topbar-placeholder").innerHTML = html;
            });
    </script>

    <div class="container">
        <h1>🔧 Developer Tools – Question Management</h1>

        <!-- Add Questions Section -->
        <div class="tool-section">
            <div class="section-title">➕ Add Questions</div>
            <div class="button-grid">
                <button class="btn-sm" onclick="addQuestionsToCategory('Movies', 10)">Add 10 to Movies</button>
                <button class="btn-sm" onclick="addQuestionsToAllCategories()">Add 10 to Each Category</button>
                <button class="btn-sm btn-warning" onclick="confirmBulkAdd()">Bulk Add 120 Questions</button>
            </div>
        </div>

        <!-- Test Tools Section -->
        <div class="tool-section">
            <div class="section-title">🧪 Test Tools</div>
            <div class="button-grid">
                <button class="btn-sm" onclick="getRandomQuestions(8)">Get 8 Random</button>
                <button class="btn-sm" onclick="getRandomQuestions(12)">Get 12 Random</button>
                <button class="btn-sm" onclick="testSessionDeduplication()">Check Deduplication</button>
            </div>
            <div class="loading-indicator" id="testLoading">Processing...</div>
            <div class="results-section" id="testResults" style="display: none;">
                <h3>Test Results</h3>
                <div class="results-content" id="testResultsContent"></div>
            </div>
        </div>

        <!-- Database Control Section -->
        <div class="tool-section">
            <div class="section-title">📊 Database Control</div>
            <div class="button-grid">
                <button class="btn-sm btn-warning" onclick="checkCategoryBalance()">Check Balance</button>
                <button class="btn-sm btn-danger" onclick="confirmDeleteCategory()">Delete Category</button>
            </div>
        </div>

        <!-- View Questions Section -->
        <div class="tool-section">
            <div class="section-title">👁️ View Questions</div>
            <div class="button-grid">
                <button class="btn-sm" onclick="openQuestionViewer()">Open Admin View</button>
                <button class="btn-sm" onclick="checkQuestionCoverage()">Verify Coverage</button>
            </div>
        </div>
    </div>

    <script src="scripts/questionManager.js"></script>
    <script>
        // Confirmation dialog system
        let currentConfirmAction = null;

        function showConfirmDialog(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmDialog').style.display = 'flex';
            currentConfirmAction = onConfirm;
        }

        function hideConfirmDialog() {
            document.getElementById('confirmDialog').style.display = 'none';
            currentConfirmAction = null;
        }

        document.getElementById('confirmYes').addEventListener('click', () => {
            if (currentConfirmAction) {
                currentConfirmAction();
            }
            hideConfirmDialog();
        });

        document.getElementById('confirmNo').addEventListener('click', hideConfirmDialog);

        // Close dialog when clicking outside
        document.getElementById('confirmDialog').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                hideConfirmDialog();
            }
        });

        // Toast notification system
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function showLoading(show = true) {
            const loading = document.getElementById('testLoading');
            loading.style.display = show ? 'block' : 'none';
        }

        function showResults(content) {
            const resultsSection = document.getElementById('testResults');
            const resultsContent = document.getElementById('testResultsContent');
            resultsContent.textContent = content;
            resultsSection.style.display = 'block';
        }

        // Add Questions Functions
        async function addQuestionsToCategory(category, count) {
            try {
                showLoading();
                const response = await fetch(`/api/questions/add?category=${category}&count=${count}`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showToast(`✅ ${count} questions added to ${category}!`);
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('Error adding questions:', error);
                showToast(`❌ Failed to add questions to ${category}`, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function addQuestionsToAllCategories() {
            try {
                showLoading();
                const categories = ['History', 'Science', 'Sports', 'Geography', 'Literature', 'Math', 'Movies', 'Music', 'Art', 'Technology', 'Food', 'Nature', 'Politics', 'Misc'];
                let successCount = 0;
                
                for (const category of categories) {
                    try {
                        const response = await fetch(`/api/questions/add?category=${category}&count=10`, {
                            method: 'POST'
                        });
                        if (response.ok) successCount++;
                    } catch (error) {
                        console.error(`Failed to add to ${category}:`, error);
                    }
                }
                
                showToast(`✅ Added 10 questions to ${successCount}/${categories.length} categories`);
            } catch (error) {
                console.error('Error in bulk add:', error);
                showToast('❌ Failed to add questions to all categories', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Confirmation wrappers for sensitive actions
        function confirmBulkAdd() {
            showConfirmDialog(
                '⚠️ Bulk Add Questions',
                'Are you sure you want to add 120 test questions? This will add many questions to the database and cannot be undone.',
                bulkAddTestQuestions
            );
        }

        async function bulkAddTestQuestions() {
            try {
                showLoading();
                const response = await fetch('/api/questions/bulk-add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: 120 })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showToast(`✅ Successfully added ${data.added || 120} test questions!`);
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('Error in bulk add:', error);
                showToast('❌ Failed to bulk add test questions', 'error');
            } finally {
                showLoading(false);
            }
        }

        function confirmDeleteCategory() {
            const category = prompt('Enter category name to delete ALL questions from:');
            if (category) {
                showConfirmDialog(
                    '🚨 Delete All Questions',
                    `This will permanently DELETE ALL questions in "${category}". This action cannot be undone. Are you absolutely sure?`,
                    () => deleteCategoryQuestions(category)
                );
            }
        }

        // Test Tools Functions
        async function getRandomQuestions(count) {
            try {
                showLoading();
                const response = await fetch(`/api/questions/random?count=${count}`);
                const data = await response.json();
                
                console.log(`📋 ${count} Random Questions:`, data);
                
                const summary = `Fetched ${count} questions\nCategories: ${Object.keys(data.categoryDistribution || {}).length}\nTotal available: ${data.questions?.length || 0}`;
                showResults(summary);
                showToast(`✅ Fetched ${count} random questions`);
                
            } catch (error) {
                console.error('Error fetching random questions:', error);
                showToast(`❌ Failed to fetch ${count} random questions`, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function testSessionDeduplication() {
            try {
                showLoading();
                
                if (typeof QuestionManager === 'undefined') {
                    throw new Error('QuestionManager not available');
                }
                
                const qm = new QuestionManager();
                const result = await qm.getRandomQuestions(5);
                
                const summary = `Session: ${result.sessionInfo.sessionId}\nUsed: ${result.sessionInfo.totalUsed}\nExcluded: ${result.sessionInfo.excludedThisRequest}\nReturned: ${result.questions.length}`;
                
                console.log('🧪 Session Deduplication Test:', result);
                showResults(summary);
                showToast('✅ Session deduplication test completed');
                
            } catch (error) {
                console.error('Error testing deduplication:', error);
                showToast('❌ Failed to test session deduplication', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Database Control Functions
        async function checkCategoryBalance() {
            try {
                showLoading();
                const response = await fetch('/api/questions/verify');
                const data = await response.json();
                
                console.log('📊 Category Balance:', data);
                
                const summary = `Total: ${data.totalQuestions}\nCategories: ${data.stats?.length || 0}\nCheck console for details`;
                showResults(summary);
                showToast('✅ Category balance check completed');
                
            } catch (error) {
                console.error('Error checking balance:', error);
                showToast('❌ Failed to check category balance', 'error');
            } finally {
                showLoading(false);
            }
        }

        async function deleteCategoryQuestions(category) {
            try {
                showLoading();
                const response = await fetch(`/api/questions/category/${category}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showToast(`✅ Deleted ${data.deletedCount || 0} questions from ${category}`);
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('Error deleting category:', error);
                showToast(`❌ Failed to delete questions from ${category}`, 'error');
            } finally {
                showLoading(false);
            }
        }

        // View Functions
        function openQuestionViewer() {
            window.open('/test2-questions.html', '_blank');
            showToast('✅ Opened Question Admin View');
        }

        async function checkQuestionCoverage() {
            try {
                showLoading();
                const response = await fetch('/api/questions/verify');
                const data = await response.json();
                
                console.log('🔍 Question Coverage:', data);
                showToast(`✅ Coverage: ${data.totalQuestions} total questions`);
                
                const summary = `Total: ${data.totalQuestions}\nActive: ${data.activeQuestions || data.totalQuestions}\nCategories: ${data.stats?.length || 0}`;
                showResults(summary);
                
            } catch (error) {
                console.error('Error checking coverage:', error);
                showToast('❌ Failed to check question coverage', 'error');
            } finally {
                showLoading(false);
            }
        }

        console.log('✅ Developer Tools loaded successfully');
    </script>
</body>
</html>

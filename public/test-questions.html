<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Distribution Test</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0b1e;
            color: white;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .section {
            background: #1a1d3a;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #333;
        }

        button {
            background: #7fffd4;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #5fb3a3;
            transform: translateY(-1px);
        }

        .category-item {
            background: #252951;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 4px solid #7fffd4;
        }

        .category-item.low-count {
            border-left-color: #ff6b6b;
            background: #3d1f1f;
        }

        .distribution-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }

        .category-badge {
            background: #111335;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            border: 1px solid #7fffd4;
        }

        .questions-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 5px;
            background: #111335;
        }

        .question-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        .question-item:last-child {
            border-bottom: none;
        }

        h1, h2, h3, h4 {
            color: #7fffd4;
        }

        p, li {
            margin: 8px 0;
        }

        small {
            color: #aaa;
        }
    </style>
</head>

<body>
    <!-- Shared Topbar -->
    <div id="topbar-placeholder"></div>
    <script>
        fetch("/components/topbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("topbar-placeholder").innerHTML = html;
            });
    </script>

    <h1>🔍 Question Distribution Test</h1>

    <div class="section">
        <h2>Database Coverage</h2>
        <button id="checkCoverageBtn">Check Question Coverage</button>
        <div id="coverageResult"></div>
    </div>

    <div class="section">
        <h2>Random Question Selection Test</h2>
        <button id="get8QuestionsBtn">Get 8 Random Questions</button>
        <button id="get12QuestionsBtn">Get 12 Random Questions</button>
        <button id="testDeduplicationBtn">🧪 Test Session Deduplication</button>
        <div id="selectionResult"></div>
    </div>

    <script src="scripts/questionManager.js"></script>
    <script src="scripts/test-questions.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Tools – Question Management</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0b1e;
            color: white;
            margin: 0;
            padding: 6px;
            line-height: 1.4;
            font-size: 13px;
        }

        body.admin-view {
            font-size: 13px;
            line-height: 1.4;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .tool-section {
            background: #1a1d3a;
            border-radius: 6px;
            padding: 8px 12px;
            margin: 4px 0;
            border: 1px solid #333;
        }

        .section-title {
            color: #7fffd4;
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-title .emoji {
            margin-right: 4px;
        }

        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 6px;
            margin: 6px 0;
        }

        .category-btn-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .category-btn {
            background: #252951;
            color: #7fffd4;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 500;
        }

        .category-btn:hover {
            background: #333669;
            border-color: #7fffd4;
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .admin-btn, .btn-sm {
            background: #7fffd4;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: normal;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.2;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            flex: 1;
            min-width: 140px;
        }

        .admin-btn:hover, .btn-sm:hover {
            background: #5fb3a3;
            transform: translateY(-1px);
            filter: brightness(0.9);
        }

        .btn-sm.btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-sm.btn-warning:hover {
            background: #e68900;
        }

        .btn-sm.btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-sm.btn-danger:hover {
            background: #ff3838;
        }

        .badge {
            background-color: #2ecc71;
            color: white;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 12px;
            margin-top: 4px;
            opacity: 1;
            transition: opacity 0.3s ease;
            font-weight: bold;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .badge.fade-out {
            opacity: 0;
        }

        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4caf50;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            font-weight: 500;
            max-width: 250px;
            font-size: 12px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.error {
            background: #ff4757;
        }

        .toast.warning {
            background: #ff9800;
        }

        .loading-indicator {
            display: none;
            color: #7fffd4;
            font-style: italic;
            margin-top: 4px;
            font-size: 11px;
        }

        .results-section {
            background: #111335;
            border-radius: 4px;
            padding: 6px;
            margin-top: 6px;
            border: 1px solid #333;
        }

        .results-section h3 {
            color: #7fffd4;
            margin: 0 0 4px 0;
            font-size: 12px;
        }

        .results-content {
            color: #ccc;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            max-height: 80px;
            overflow-y: auto;
        }

        h1 {
            color: #7fffd4;
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 600;
        }

        h3 {
            color: #7fffd4;
            margin: 0 0 6px 0;
            font-size: 14px;
            font-weight: 600;
        }

        .confirm-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 10px;
        }

        .confirm-content {
            background: #1a1d3a;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px;
            max-width: 350px;
            text-align: center;
            width: 100%;
        }

        .confirm-title {
            color: #ff9800;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .confirm-message {
            color: #ccc;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .confirm-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .confirm-btn.confirm {
            background: #ff4757;
            color: white;
        }

        .confirm-btn.confirm:hover {
            background: #ff3838;
        }

        .confirm-btn.cancel {
            background: #666;
            color: white;
        }

        .confirm-btn.cancel:hover {
            background: #777;
        }

        /* Top navbar styling */
        #topbar-placeholder {
            overflow-x: auto;
        }

        /* Desktop optimizations */
        @media (min-width: 1001px) {
            .button-grid {
                gap: 10px;
            }

            .category-buttons {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 8px;
            }

            .tool-section {
                margin: 3px 0;
            }
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                padding: 4px;
                font-size: 13px;
            }

            .container {
                padding: 0 2px;
            }

            .button-grid {
                flex-direction: column;
                gap: 4px;
            }

            .admin-btn, .btn-sm {
                min-width: auto;
                width: 100%;
            }

            .category-buttons {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 4px;
            }

            .category-btn {
                padding: 4px 8px;
                font-size: 11px;
                min-height: 22px;
            }

            .toast {
                right: 4px;
                left: 4px;
                max-width: none;
                font-size: 11px;
            }

            .admin-btn, .btn-sm {
                font-size: 13px;
                padding: 4px 8px;
                min-height: 22px;
                margin-bottom: 3px;
            }

            .tool-section {
                padding: 6px 8px;
                margin: 3px 0;
            }

            .section-title {
                font-size: 14px;
            }

            .confirm-content {
                padding: 12px;
                margin: 0 5px;
            }

            .confirm-title {
                font-size: 13px;
            }

            .confirm-message {
                font-size: 11px;
            }

            .confirm-btn {
                padding: 4px 8px;
                font-size: 11px;
            }

            h1 {
                font-size: 15px;
                margin: 0 0 6px 0;
            }

            #topbar-placeholder {
                overflow-x: auto;
                white-space: nowrap;
            }

            .badge {
                font-size: 9px;
                padding: 2px 5px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 3px;
                font-size: 12px;
            }

            .admin-btn, .btn-sm {
                font-size: 12px;
                padding: 3px 6px;
                min-height: 20px;
            }

            .category-btn {
                font-size: 10px;
                padding: 3px 6px;
                min-height: 20px;
            }

            .section-title {
                font-size: 13px;
            }

            h1 {
                font-size: 14px;
            }

            .tool-section {
                padding: 5px 6px;
            }

            .badge {
                font-size: 8px;
                padding: 2px 4px;
            }
        }

        /* Ultra-compact for very small screens */
        @media (max-width: 360px) {
            .tool-section {
                padding: 4px 5px;
            }

            .admin-btn, .btn-sm {
                font-size: 11px;
                padding: 3px 5px;
                min-height: 18px;
            }

            .category-btn {
                font-size: 9px;
                padding: 2px 4px;
                min-height: 18px;
            }

            .section-title {
                font-size: 12px;
            }

            .category-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: 2px;
            }
        }

        /* Active state for button groups */
        .tool-section:hover {
            background: rgba(26, 29, 58, 0.8);
        }

        /* Glow effect for buttons when questions are added */
        .glow {
            box-shadow: 0 0 10px 2px #00ff99;
            transition: box-shadow 0.3s ease;
        }

        .btn-add {
            background-color: #a0ffbf;
            color: #000;
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 6px;
            min-width: 180px;
        }

        .btn-add:hover {
            background-color: #7fde9f;
            transform: translateY(-1px);
        }

        /* Delete buttons with RED text and outline */
        .btn-delete {
            background: transparent;
            border: 2px solid #ff4d4d;
            color: #ff4d4d;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            min-width: 140px;
        }

        .btn-delete:hover {
            background: rgba(255, 77, 77, 0.1);
            transform: translateY(-1px);
            border-color: #ff6666;
            color: #ff6666;
        }

        /* Insights Panel Styling */
        .insights-panel {
            border: 2px solid #3d6df1;
            background: rgba(61, 109, 241, 0.05);
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
        }

        .insights-panel .section-title {
            color: #5d8aff;
        }

        .insights-panel .btn-secondary {
            background-color: #3d6df1;
            color: white;
            border: 1px solid #2a55c9;
            font-size: 0.85rem;
            font-weight: normal;
            padding: 6px 10px;
        }

        .insights-panel .btn-secondary:hover {
            background-color: #2a55c9;
            border-color: #1e3fa0;
            transform: translateY(-1px);
        }

        .insight-description {
            margin-top: 10px;
            text-align: center;
            color: #999;
            font-style: italic;
        }

        .insight-description small {
            font-size: 11px;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/global.js"></script>
    <script src="scripts/questionManager.js"></script>
    <script src="scripts/test-questions.js"></script>

    <script>
        // Store category counts
        let categoryCounts = {};

        // Toast notification system
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // Add badge to category button
        function addBadgeToCategory(category, count) {
            const container = document.querySelector(`.category-btn-container [data-category="${category}"]`).parentNode;
            if (container) {
                // Remove existing badge if any
                const existingBadge = container.querySelector('.badge');
                if (existingBadge) {
                    existingBadge.remove();
                }

                // Add new badge
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = `+${count}`;
                container.appendChild(badge);

                // Auto-fade after 10 seconds
                setTimeout(() => {
                    badge.classList.add('fade-out');
                    setTimeout(() => {
                        if (badge.parentNode) {
                            badge.remove();
                        }
                    }, 300);
                }, 10000);
            }
        }

        // Function to fetch and display question counts for each category
        async function loadCategoryCounts() {
            try {
                const response = await fetch('/api/questions/verify');
                const data = await response.json();

                if (data.stats && Array.isArray(data.stats)) {
                    // Create a map of category counts
                    categoryCounts = {};
                    data.stats.forEach(stat => {
                        categoryCounts[stat._id] = stat.count;
                    });

                    // Update category buttons with counts
                    const categoryButtons = document.querySelectorAll('.add-btn[data-category]');
                    categoryButtons.forEach(button => {
                        const category = button.getAttribute('data-category');
                        const count = categoryCounts[category] || 0;
                        button.setAttribute('data-count', count);
                        button.textContent = `Add to ${category} (${count})`;
                    });

                    console.log('✅ Category counts loaded:', categoryCounts);
                    return categoryCounts;
                } else {
                    console.warn('⚠️ No category stats found in response');
                    return {};
                }

            } catch (error) {
                console.error('❌ Error loading category counts:', error);
                return {};
            }
        }

        // Update specific category count
        function updateCategoryCount(category, newCount, addedCount = 0) {
            const button = document.querySelector(`.add-btn[data-category="${category}"]`);
            if (button) {
                // Update data-count attribute
                button.setAttribute('data-count', newCount);
                button.textContent = `Add to ${category} (${newCount})`;
                categoryCounts[category] = newCount;

                // Add badge if questions were added
                if (addedCount > 0) {
                    addBadgeToCategory(category, addedCount);
                }

                // Add glow effect for visual feedback
                if (addedCount > 0) {
                    button.classList.add('glow');
                    setTimeout(() => button.classList.remove('glow'), 1000);
                }
            }
        }

        // Add event listeners to all category buttons
        document.addEventListener('DOMContentLoaded', function() {
            // Single clean event listener for add buttons
            document.querySelectorAll('.add-btn').forEach(button => {
                button.addEventListener('click', async (e) => {
                    // Prevent double-firing
                    if (e.target.classList.contains('processing')) return;
                    e.target.classList.add('processing');

                    const category = button.getAttribute('data-category');

                    if (!category) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Category not specified'
                        });
                        e.target.classList.remove('processing');
                        return;
                    }

                    try {
                        const response = await fetch(`/api/addQuestions?category=${category}`);

                        if (!response.ok) {
                            throw new Error(`Server responded with status ${response.status}`);
                        }

                        const data = await response.json();

                        if (data.success) {
                            // ✅ SUCCESS – update count & show popup
                            let count = parseInt(button.getAttribute('data-count')) || 0;
                            count += 10;
                            button.setAttribute('data-count', count);
                            button.textContent = `Add to ${category} (${count})`;
                            categoryCounts[category] = count;

                            // Add visual feedback
                            button.classList.add('glow');
                            setTimeout(() => button.classList.remove('glow'), 1000);

                            // Add badge for visual confirmation
                            addBadgeToCategory(category, 10);

                            // Success popup
                            Swal.fire({
                                position: 'top-end',
                                icon: 'success',
                                title: `10 questions added to ${category}!`,
                                showConfirmButton: false,
                                timer: 1500,
                                toast: true,
                                background: '#a0ffbf'
                            });

                        } else {
                            throw new Error(data.message || "Unknown backend response");
                        }

                    } catch (err) {
                        // ❌ ONLY show this if fetch failed or backend returned error
                        Swal.fire({
                            icon: 'error',
                            title: 'Network error',
                            text: err.message || 'Failed to add questions'
                        });
                    } finally {
                        // Remove processing class
                        e.target.classList.remove('processing');
                    }
                });
            });
        });

        // Add event listener for unified "Add 10 per Category" button
        document.addEventListener('DOMContentLoaded', function() {
            const addAllBtn = document.getElementById('add-all-btn');
            if (addAllBtn) {
                addAllBtn.addEventListener('click', async () => {
                    const categories = [
                        "History", "Science", "Sports", "Geography",
                        "Literature", "Mathematics", "Movies", "Music",
                        "Art", "Technology", "Food", "Misc"
                    ];

                    let successCount = 0;
                    let failureCount = 0;

                    // Show loading state
                    addAllBtn.disabled = true;
                    addAllBtn.textContent = '⏳ Adding...';

                    for (const category of categories) {
                        try {
                            const res = await fetch(`/api/addQuestions?category=${category}`);
                            const data = await res.json();

                            if (data.success) {
                                successCount++;
                                // Find the corresponding button and update count
                                const btn = document.querySelector(`.add-btn[data-category="${category}"]`);
                                if (btn) {
                                    let count = parseInt(btn.getAttribute('data-count')) || 0;
                                    count += 10;
                                    btn.setAttribute('data-count', count);
                                }
                            } else {
                                failureCount++;
                                console.error(`Error adding to ${category}:`, data.message);
                            }
                        } catch (err) {
                            failureCount++;
                            console.error(`Network error for ${category}:`, err);
                        }
                    }

                    // Reset button state
                    addAllBtn.disabled = false;
                    addAllBtn.textContent = '➕ Add 10 per Category';

                    // Show success message
                    if (successCount > 0) {
                        Swal.fire({
                            icon: 'success',
                            title: `✅ Added 10 questions to ${successCount} categories!`,
                            text: failureCount > 0 ? `${failureCount} categories failed` : '',
                            showConfirmButton: false,
                            timer: 2000,
                            toast: true,
                            position: 'top-end',
                            background: '#a0ffbf'
                        });

                        // Refresh category counts
                        loadCategoryCounts();
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Failed to add questions',
                            text: 'All categories failed to update'
                        });
                    }
                });
            }
        });

        // Test functions
        async function getRandomQuestions(count) {
            try {
                document.getElementById('testLoading').style.display = 'block';

                const response = await fetch(`/api/questions/random?count=${count}`);
                const data = await response.json();

                document.getElementById('testResults').style.display = 'block';
                document.getElementById('testResultsContent').textContent = 
                    `Fetched ${count} questions from ${Object.keys(data.categoryDistribution || {}).length} categories. Check console for details.`;

                console.log(`📋 ${count} Random Questions Response:`, data);
                showToast(`✅ Fetched ${count} random questions`);

            } catch (error) {
                console.error(`❌ Error fetching ${count} questions:`, error);
                showToast('❌ Error fetching questions', 'error');
            } finally {
                document.getElementById('testLoading').style.display = 'none';
            }
        }

        async function testSessionDeduplication() {
            try {
                document.getElementById('testLoading').style.display = 'block';

                if (typeof QuestionManager === 'undefined') {
                    showToast('❌ QuestionManager not available', 'error');
                    return;
                }

                const qm = new QuestionManager();
                const result = await qm.getRandomQuestions(5);

                document.getElementById('testResults').style.display = 'block';
                document.getElementById('testResultsContent').textContent = 
                    `Session: ${result.sessionInfo.sessionId.substring(0, 20)}...\nUsed: ${result.sessionInfo.totalUsed}\nExcluded: ${result.sessionInfo.excludedThisRequest}`;

                console.log('✅ Deduplication Test Results:', result);
                showToast('✅ Deduplication test completed');

            } catch (error) {
                console.error('❌ Error testing deduplication:', error);
                showToast('❌ Error testing deduplication', 'error');
            } finally {
                document.getElementById('testLoading').style.display = 'none';
            }
        }

        function checkCategoryBalance() {
            showToast('Check console for balance details', 'warning');
            fetch('/api/questions/verify')
                .then(res => res.json())
                .then(data => {
                    console.log('📊 Category Balance:', data);
                })
                .catch(err => {
                    console.error('Error checking balance:', err);
                    showToast('❌ Error checking balance', 'error');
                });
        }

        function deleteCategory(category) {
            fetch(`/api/deleteCategory?category=${category}`, {
                method: 'GET'
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        Swal.fire({
                            icon: 'success',
                            title: `Category "${category}" deleted.`,
                            timer: 1500,
                            toast: true,
                            position: 'top-end'
                        });
                        // Refresh category counts after deletion
                        loadCategoryCounts();
                    } else {
                        throw new Error(data.message);
                    }
                })
                .catch(err => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Failed to delete category',
                        text: err.message
                    });
                });
        }

        function openQuestionViewer() {
            window.open('test2-questions.html', '_blank');
        }

        function checkQuestionCoverage() {
            showToast('Check console for coverage details', 'warning');
            fetch('/api/questions/verify')
                .then(res => res.json())
                .then(data => {
                    console.log('📊 Question Coverage:', data);
                })
                .catch(err => {
                    console.error('Error checking coverage:', err);
                    showToast('❌ Error checking coverage', 'error');
                });
        }

        // New delete category functions
        function confirmDeleteCategory(category) {
            Swal.fire({
                title: 'Confirm Delete',
                text: `Are you sure you want to delete all questions in ${category}?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    deleteCategory(category);
                }
            });
        }

        function confirmDeleteAll() {
            Swal.fire({
                title: 'Confirm Delete ALL',
                text: `Are you sure you want to delete ALL questions in ALL categories? This is irreversible!`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete ALL!'
            }).then((result) => {
                if (result.isConfirmed) {
                    deleteAllCategories();
                }
            });
        }

        async function deleteAllCategories() {
            try {
                const response = await fetch('/api/deleteAllCategories');
                const data = await response.json();
                
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'All categories deleted successfully!',
                        timer: 1500,
                        toast: true,
                        position: 'top-end'
                    });
                    // Refresh category counts after deletion
                    loadCategoryCounts();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('Failed to delete all categories:', error);
                showToast('Failed to delete all categories', 'error');
            }
        }

        // Load counts when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadCategoryCounts();
            console.log('✅ Developer Tools loaded successfully');
        });

        // Listen for storage events to sync with other tabs
        window.addEventListener('storage', function(e) {
            if (e.key === 'questionsAdded') {
                try {
                    const data = JSON.parse(e.newValue);
                    loadCategoryCounts(); // Refresh all counts
                    localStorage.removeItem('questionsAdded');
                } catch (error) {
                    console.error('Error processing storage event:', error);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Tools – Question Management</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0b1e;
            color: white;
            margin: 0;
            padding: 6px;
            line-height: 1.4;
            font-size: 13px;
        }

        body.admin-view {
            font-size: 13px;
            line-height: 1.4;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .tool-section {
            background: #1a1d3a;
            border-radius: 6px;
            padding: 8px 12px;
            margin: 4px 0;
            border: 1px solid #333;
        }

        .section-title {
            color: #7fffd4;
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-title .emoji {
            margin-right: 4px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .admin-btn, .btn-sm {
            background: #7fffd4;
            color: #000;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.2;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .admin-btn:hover, .btn-sm:hover {
            background: #5fb3a3;
            transform: translateY(-1px);
            filter: brightness(0.9);
        }

        .btn-sm.btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-sm.btn-warning:hover {
            background: #e68900;
        }

        .btn-sm.btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-sm.btn-danger:hover {
            background: #ff3838;
        }

        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4caf50;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            font-weight: 500;
            max-width: 250px;
            font-size: 12px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.error {
            background: #ff4757;
        }

        .toast.warning {
            background: #ff9800;
        }

        .loading-indicator {
            display: none;
            color: #7fffd4;
            font-style: italic;
            margin-top: 4px;
            font-size: 11px;
        }

        .results-section {
            background: #111335;
            border-radius: 4px;
            padding: 6px;
            margin-top: 6px;
            border: 1px solid #333;
        }

        .results-section h3 {
            color: #7fffd4;
            margin: 0 0 4px 0;
            font-size: 12px;
        }

        .results-content {
            color: #ccc;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            max-height: 80px;
            overflow-y: auto;
        }

        h1 {
            color: #7fffd4;
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .confirm-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 10px;
        }

        .confirm-content {
            background: #1a1d3a;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px;
            max-width: 350px;
            text-align: center;
            width: 100%;
        }

        .confirm-title {
            color: #ff9800;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .confirm-message {
            color: #ccc;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .confirm-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .confirm-btn.confirm {
            background: #ff4757;
            color: white;
        }

        .confirm-btn.confirm:hover {
            background: #ff3838;
        }

        .confirm-btn.cancel {
            background: #666;
            color: white;
        }

        .confirm-btn.cancel:hover {
            background: #777;
        }

        /* Top navbar styling */
        #topbar-placeholder {
            overflow-x: auto;
        }

        /* Desktop optimizations */
        @media (min-width: 1001px) {
            .button-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .tool-section {
                margin: 3px 0;
            }
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                padding: 4px;
                font-size: 13px;
            }

            .container {
                padding: 0 2px;
            }

            .button-grid {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            .toast {
                right: 4px;
                left: 4px;
                max-width: none;
                font-size: 11px;
            }

            .admin-btn, .btn-sm {
                font-size: 13px;
                padding: 4px 8px;
                min-height: 22px;
                margin-bottom: 3px;
            }

            .tool-section {
                padding: 6px 8px;
                margin: 3px 0;
            }

            .section-title {
                font-size: 14px;
            }

            .confirm-content {
                padding: 12px;
                margin: 0 5px;
            }

            .confirm-title {
                font-size: 13px;
            }

            .confirm-message {
                font-size: 11px;
            }

            .confirm-btn {
                padding: 4px 8px;
                font-size: 11px;
            }

            h1 {
                font-size: 15px;
                margin: 0 0 6px 0;
            }

            #topbar-placeholder {
                overflow-x: auto;
                white-space: nowrap;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 3px;
                font-size: 12px;
            }

            .admin-btn, .btn-sm {
                font-size: 12px;
                padding: 3px 6px;
                min-height: 20px;
            }

            .section-title {
                font-size: 13px;
            }

            h1 {
                font-size: 14px;
            }

            .tool-section {
                padding: 5px 6px;
            }
        }

        /* Ultra-compact for very small screens */
        @media (max-width: 360px) {
            .tool-section {
                padding: 4px 5px;
            }

            .admin-btn, .btn-sm {
                font-size: 11px;
                padding: 3px 5px;
                min-height: 18px;
            }

            .section-title {
                font-size: 12px;
            }
        }

        /* Active state for button groups */
        .tool-section:hover {
            background: rgba(26, 29, 58, 0.8);
        }
    </style>
</head>

<body class="admin-view">
    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <!-- Confirmation dialog -->
    <div id="confirmDialog" class="confirm-dialog">
        <div class="confirm-content">
            <div class="confirm-title" id="confirmTitle">⚠️ Confirm Action</div>
            <div class="confirm-message" id="confirmMessage">Are you sure you want to proceed?</div>
            <div class="confirm-buttons">
                <button class="confirm-btn confirm" id="confirmYes">Yes, Proceed</button>
                <button class="confirm-btn cancel" id="confirmNo">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Shared Topbar -->
    <div id="topbar-placeholder"></div>
    <script>
        fetch("/components/topbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("topbar-placeholder").innerHTML = html;
            });
    </script>

    <div class="container">
        <h1>🔧 Developer Tools – Question Management</h1>

        <!-- Add Questions Section -->
        <div class="tool-section">
            <div class="section-title"><span class="emoji">➕</span>Add Questions</div>
            <div class="button-grid">
                <button class="admin-btn" onclick="addQuestionsToCategory('Movies', 10)">Add 10 to Movies</button>
                <button class="admin-btn" onclick="addQuestionsToAllCategories()">Add 10 to Each Category</button>
                <button class="admin-btn btn-warning" onclick="confirmBulkAdd()">Bulk Add 120 Questions</button>
            </div>
        </div>

        <!-- Test Tools Section -->
        <div class="tool-section">
            <div class="section-title"><span class="emoji">🧪</span>Test Tools</div>
            <div class="button-grid">
                <button class="admin-btn" onclick="getRandomQuestions(8)">Get 8 Random</button>
                <button class="admin-btn" onclick="getRandomQuestions(12)">Get 12 Random</button>
                <button class="admin-btn" onclick="testSessionDeduplication()">Check Deduplication</button>
            </div>
            <div class="loading-indicator" id="testLoading">Processing...</div>
            <div class="results-section" id="testResults" style="display: none;">
                <h3>Test Results</h3>
                <div class="results-content" id="testResultsContent"></div>
            </div>
        </div>

        <!-- Database Control Section -->
        <div class="tool-section">
            <div class="section-title"><span class="emoji">📊</span>Database Control</div>
            <div class="button-grid">
                <button class="admin-btn btn-warning" onclick="checkCategoryBalance()">Check Balance</button>
                <button class="admin-btn btn-danger" onclick="confirmDeleteCategory()">Delete Category</button>
            </div>
        </div>

        <!-- View Questions Section -->
        <div class="tool-section">
            <div class="section-title"><span class="emoji">👁️</span>View Questions</div>
            <div class="button-grid">
                <button class="admin-btn" onclick="openQuestionViewer()">Open Admin View</button>
                <button class="admin-btn" onclick="checkQuestionCoverage()">Verify Coverage</button>
            </div>
        </div>
    </div>

    <script src="scripts/global.js"></script>
    <script src="scripts/questionManager.js"></script>
    <script src="scripts/test-questions.js"></script>
</body>
</html>

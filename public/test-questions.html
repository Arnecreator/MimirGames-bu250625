
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Tools – Question Management</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0b1e;
            color: white;
            margin: 0;
            padding: 6px;
            line-height: 1.4;
            font-size: 13px;
        }

        body.admin-view {
            font-size: 13px;
            line-height: 1.4;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .tool-section {
            background: #1a1d3a;
            border-radius: 6px;
            padding: 8px 12px;
            margin: 4px 0;
            border: 1px solid #333;
        }

        .section-title {
            color: #7fffd4;
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section-title .emoji {
            margin-right: 4px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 6px;
            margin: 6px 0;
        }

        .category-btn-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .category-btn {
            background: #252951;
            color: #7fffd4;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 500;
        }

        .category-btn:hover {
            background: #333669;
            border-color: #7fffd4;
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .admin-btn, .btn-sm {
            background: #7fffd4;
            color: #000;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.2;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .admin-btn:hover, .btn-sm:hover {
            background: #5fb3a3;
            transform: translateY(-1px);
            filter: brightness(0.9);
        }

        .btn-sm.btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-sm.btn-warning:hover {
            background: #e68900;
        }

        .btn-sm.btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-sm.btn-danger:hover {
            background: #ff3838;
        }

        .badge {
            background-color: #2ecc71;
            color: white;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 12px;
            margin-top: 4px;
            opacity: 1;
            transition: opacity 0.3s ease;
            font-weight: bold;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .badge.fade-out {
            opacity: 0;
        }

        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4caf50;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            font-weight: 500;
            max-width: 250px;
            font-size: 12px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.error {
            background: #ff4757;
        }

        .toast.warning {
            background: #ff9800;
        }

        .loading-indicator {
            display: none;
            color: #7fffd4;
            font-style: italic;
            margin-top: 4px;
            font-size: 11px;
        }

        .results-section {
            background: #111335;
            border-radius: 4px;
            padding: 6px;
            margin-top: 6px;
            border: 1px solid #333;
        }

        .results-section h3 {
            color: #7fffd4;
            margin: 0 0 4px 0;
            font-size: 12px;
        }

        .results-content {
            color: #ccc;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            max-height: 80px;
            overflow-y: auto;
        }

        h1 {
            color: #7fffd4;
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 600;
        }

        h3 {
            color: #7fffd4;
            margin: 0 0 6px 0;
            font-size: 14px;
            font-weight: 600;
        }

        .confirm-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 10px;
        }

        .confirm-content {
            background: #1a1d3a;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px;
            max-width: 350px;
            text-align: center;
            width: 100%;
        }

        .confirm-title {
            color: #ff9800;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .confirm-message {
            color: #ccc;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .confirm-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .confirm-btn.confirm {
            background: #ff4757;
            color: white;
        }

        .confirm-btn.confirm:hover {
            background: #ff3838;
        }

        .confirm-btn.cancel {
            background: #666;
            color: white;
        }

        .confirm-btn.cancel:hover {
            background: #777;
        }

        /* Top navbar styling */
        #topbar-placeholder {
            overflow-x: auto;
        }

        /* Desktop optimizations */
        @media (min-width: 1001px) {
            .button-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .category-buttons {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 8px;
            }

            .tool-section {
                margin: 3px 0;
            }
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                padding: 4px;
                font-size: 13px;
            }

            .container {
                padding: 0 2px;
            }

            .button-grid {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            .category-buttons {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 4px;
            }

            .category-btn {
                padding: 4px 8px;
                font-size: 11px;
                min-height: 22px;
            }

            .toast {
                right: 4px;
                left: 4px;
                max-width: none;
                font-size: 11px;
            }

            .admin-btn, .btn-sm {
                font-size: 13px;
                padding: 4px 8px;
                min-height: 22px;
                margin-bottom: 3px;
            }

            .tool-section {
                padding: 6px 8px;
                margin: 3px 0;
            }

            .section-title {
                font-size: 14px;
            }

            .confirm-content {
                padding: 12px;
                margin: 0 5px;
            }

            .confirm-title {
                font-size: 13px;
            }

            .confirm-message {
                font-size: 11px;
            }

            .confirm-btn {
                padding: 4px 8px;
                font-size: 11px;
            }

            h1 {
                font-size: 15px;
                margin: 0 0 6px 0;
            }

            #topbar-placeholder {
                overflow-x: auto;
                white-space: nowrap;
            }

            .badge {
                font-size: 9px;
                padding: 2px 5px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 3px;
                font-size: 12px;
            }

            .admin-btn, .btn-sm {
                font-size: 12px;
                padding: 3px 6px;
                min-height: 20px;
            }

            .category-btn {
                font-size: 10px;
                padding: 3px 6px;
                min-height: 20px;
            }

            .section-title {
                font-size: 13px;
            }

            h1 {
                font-size: 14px;
            }

            .tool-section {
                padding: 5px 6px;
            }

            .category-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: 3px;
            }

            .badge {
                font-size: 8px;
                padding: 2px 4px;
            }
        }

        /* Ultra-compact for very small screens */
        @media (max-width: 360px) {
            .tool-section {
                padding: 4px 5px;
            }

            .admin-btn, .btn-sm {
                font-size: 11px;
                padding: 3px 5px;
                min-height: 18px;
            }

            .category-btn {
                font-size: 9px;
                padding: 2px 4px;
                min-height: 18px;
            }

            .section-title {
                font-size: 12px;
            }

            .category-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: 2px;
            }
        }

        /* Active state for button groups */
        .tool-section:hover {
            background: rgba(26, 29, 58, 0.8);
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/global.js"></script>

    <script>
        // Store category counts
        let categoryCounts = {};

        // Toast notification system
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // Add badge to category button
        function addBadgeToCategory(category, count) {
            const container = document.querySelector(`.category-btn-container [data-category="${category}"]`).parentNode;
            if (container) {
                // Remove existing badge if any
                const existingBadge = container.querySelector('.badge');
                if (existingBadge) {
                    existingBadge.remove();
                }

                // Add new badge
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = `+${count}`;
                container.appendChild(badge);

                // Auto-fade after 10 seconds
                setTimeout(() => {
                    badge.classList.add('fade-out');
                    setTimeout(() => {
                        if (badge.parentNode) {
                            badge.remove();
                        }
                    }, 300);
                }, 10000);
            }
        }

        // Function to fetch and display question counts for each category
        async function loadCategoryCounts() {
            try {
                const response = await fetch('/api/questions/verify');
                const data = await response.json();
                
                if (data.stats && Array.isArray(data.stats)) {
                    // Create a map of category counts
                    categoryCounts = {};
                    data.stats.forEach(stat => {
                        categoryCounts[stat._id] = stat.count;
                    });
                    
                    // Update category buttons with counts
                    const categoryButtons = document.querySelectorAll('.category-btn[data-category]');
                    categoryButtons.forEach(button => {
                        const category = button.getAttribute('data-category');
                        const count = categoryCounts[category] || 0;
                        button.textContent = `Add to ${category} (${count})`;
                    });
                    
                    console.log('✅ Category counts loaded:', categoryCounts);
                    return categoryCounts;
                } else {
                    console.warn('⚠️ No category stats found in response');
                    return {};
                }
                
            } catch (error) {
                console.error('❌ Error loading category counts:', error);
                return {};
            }
        }

        // Update specific category count
        function updateCategoryCount(category, newCount, addedCount = 0) {
            const button = document.querySelector(`.category-btn[data-category="${category}"]`);
            if (button) {
                button.textContent = `Add to ${category} (${newCount})`;
                categoryCounts[category] = newCount;
                
                // Add badge if questions were added
                if (addedCount > 0) {
                    addBadgeToCategory(category, addedCount);
                }
            }
        }

        // Add questions to specific category
        async function addQuestionsToCategory(category, count) {
            try {
                showToast(`Adding ${count} questions to ${category}...`, 'warning');
                
                const response = await fetch('/api/questions/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        category: category,
                        count: count
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const newCount = (categoryCounts[category] || 0) + count;
                    updateCategoryCount(category, newCount, count);
                    showToast(`✅ ${count} questions successfully added to ${category}!`);
                    
                    // Notify other tabs
                    try {
                        localStorage.setItem('questionsAdded', JSON.stringify({
                            category: category,
                            count: count,
                            message: `✅ ${count} questions successfully added to ${category}!`
                        }));
                        
                        // Send message to other windows
                        window.postMessage({
                            type: 'questionsAdded',
                            category: category,
                            count: count,
                            message: `✅ ${count} questions successfully added to ${category}!`
                        }, '*');
                    } catch (e) {
                        console.warn('Could not notify other tabs:', e);
                    }
                } else {
                    showToast(`❌ Error: ${data.error || 'Failed to add questions'}`, 'error');
                }
            } catch (error) {
                console.error('Error adding questions:', error);
                showToast('❌ Network error. Please try again.', 'error');
            }
        }

        // Alternative function for direct button event listeners
        async function handleAddQuestions(category, count = 10) {
            return addQuestionsToCategory(category, count);
        }

        // Add event listeners to all category buttons
        document.addEventListener('DOMContentLoaded', function() {
            // Add click handlers to all category buttons
            document.querySelectorAll('.add-btn[data-category]').forEach(button => {
                button.addEventListener('click', async function() {
                    const category = this.getAttribute('data-category');
                    if (category) {
                        await handleAddQuestions(category, 10);
                    }
                });
            });

            // Alternative event listener setup for add buttons (with SweetAlert2)
            document.querySelectorAll('.add-btn').forEach(button => {
                button.addEventListener('click', async (e) => {
                    // Prevent double-firing if both handlers are active
                    if (e.target.classList.contains('processed')) return;
                    e.target.classList.add('processed');
                    
                    const category = button.getAttribute('data-category');
                    
                    if (!category) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Category not specified'
                        });
                        return;
                    }

                    try {
                        const res = await fetch(`/api/addQuestions?category=${category}`);
                        const data = await res.json();

                        if (data.success) {
                            // ✅ Success message
                            Swal.fire({
                                position: 'top-end',
                                icon: 'success',
                                title: `10 questions added to ${category}!`,
                                showConfirmButton: false,
                                timer: 1500,
                                toast: true,
                                background: '#a0ffbf'
                            });
                            
                            // Update the button count
                            const newCount = (categoryCounts[category] || 0) + 10;
                            updateCategoryCount(category, newCount, 10);
                            
                        } else {
                            throw new Error(data.message || "Unknown error");
                        }
                    } catch (err) {
                        // ❌ Error popup
                        Swal.fire({
                            icon: 'error',
                            title: 'Network error',
                            text: err.message || 'Failed to add questions'
                        });
                    } finally {
                        // Remove processed class after a short delay
                        setTimeout(() => {
                            e.target.classList.remove('processed');
                        }, 100);
                    }
                });
            });
        });

        // Add questions to all categories
        async function addQuestionsToAllCategories() {
            const categories = ['History', 'Science', 'Sports', 'Geography', 'Literature', 'Math', 'Movies', 'Music', 'Art', 'Technology', 'Food', 'Misc'];
            
            showToast('Adding 10 questions to each category...', 'warning');
            
            for (const category of categories) {
                try {
                    await addQuestionsToCategory(category, 10);
                    // Small delay between requests
                    await new Promise(resolve => setTimeout(resolve, 100));
                } catch (error) {
                    console.error(`Failed to add questions to ${category}:`, error);
                }
            }
            
            showToast('✅ Bulk add completed!');
        }

        // Confirmation dialog for bulk add
        function confirmBulkAdd() {
            document.getElementById('confirmTitle').textContent = '⚠️ Bulk Add 120 Questions';
            document.getElementById('confirmMessage').textContent = 'This will add 10 questions to each of the 12 categories. This action cannot be undone. Continue?';
            document.getElementById('confirmDialog').style.display = 'flex';
            
            document.getElementById('confirmYes').onclick = function() {
                document.getElementById('confirmDialog').style.display = 'none';
                addQuestionsToAllCategories();
            };
            
            document.getElementById('confirmNo').onclick = function() {
                document.getElementById('confirmDialog').style.display = 'none';
            };
        }

        // Test functions (keeping existing functionality)
        async function getRandomQuestions(count) {
            try {
                document.getElementById('testLoading').style.display = 'block';
                
                const response = await fetch(`/api/questions/random?count=${count}`);
                const data = await response.json();
                
                document.getElementById('testResults').style.display = 'block';
                document.getElementById('testResultsContent').textContent = 
                    `Fetched ${count} questions from ${Object.keys(data.categoryDistribution || {}).length} categories. Check console for details.`;
                
                console.log(`📋 ${count} Random Questions Response:`, data);
                showToast(`✅ Fetched ${count} random questions`);
                
            } catch (error) {
                console.error(`❌ Error fetching ${count} questions:`, error);
                showToast('❌ Error fetching questions', 'error');
            } finally {
                document.getElementById('testLoading').style.display = 'none';
            }
        }

        async function testSessionDeduplication() {
            try {
                document.getElementById('testLoading').style.display = 'block';
                
                if (typeof QuestionManager === 'undefined') {
                    showToast('❌ QuestionManager not available', 'error');
                    return;
                }

                const qm = new QuestionManager();
                const result = await qm.getRandomQuestions(5);
                
                document.getElementById('testResults').style.display = 'block';
                document.getElementById('testResultsContent').textContent = 
                    `Session: ${result.sessionInfo.sessionId.substring(0, 20)}...\nUsed: ${result.sessionInfo.totalUsed}\nExcluded: ${result.sessionInfo.excludedThisRequest}`;
                
                console.log('✅ Deduplication Test Results:', result);
                showToast('✅ Deduplication test completed');
                
            } catch (error) {
                console.error('❌ Error testing deduplication:', error);
                showToast('❌ Error testing deduplication', 'error');
            } finally {
                document.getElementById('testLoading').style.display = 'none';
            }
        }

        function checkCategoryBalance() {
            showToast('Check console for balance details', 'warning');
            fetch('/api/questions/verify')
                .then(res => res.json())
                .then(data => {
                    console.log('📊 Category Balance:', data);
                })
                .catch(err => {
                    console.error('Error checking balance:', err);
                    showToast('❌ Error checking balance', 'error');
                });
        }

        function confirmDeleteCategory() {
            showToast('❌ Delete category feature not implemented', 'error');
        }

        function openQuestionViewer() {
            window.open('test2-questions.html', '_blank');
        }

        function checkQuestionCoverage() {
            showToast('Check console for coverage details', 'warning');
            fetch('/api/questions/verify')
                .then(res => res.json())
                .then(data => {
                    console.log('📊 Question Coverage:', data);
                })
                .catch(err => {
                    console.error('Error checking coverage:', err);
                    showToast('❌ Error checking coverage', 'error');
                });
        }

        // Load counts when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadCategoryCounts();
            console.log('✅ Developer Tools loaded successfully');
        });

        // Listen for storage events to sync with other tabs
        window.addEventListener('storage', function(e) {
            if (e.key === 'questionsAdded') {
                try {
                    const data = JSON.parse(e.newValue);
                    loadCategoryCounts(); // Refresh all counts
                    localStorage.removeItem('questionsAdded');
                } catch (error) {
                    console.error('Error processing storage event:', error);
                }
            }
        });
    </script>

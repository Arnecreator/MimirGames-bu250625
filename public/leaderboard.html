
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard – Mimir Games</title>
  <link href="styles/main.css" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: Inter, sans-serif;
      background: #0a0b1e;
      color: white;
      margin: 0;
      padding: 20px;
    }
    
    .leaderboard-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .title {
      font-size: 2rem;
      margin-bottom: 10px;
      text-align: center;
      color: #00ffcc;
      font-weight: 700;
    }
    
    .your-rank {
      margin-bottom: 20px;
      font-weight: bold;
      color: #00ffcc;
      text-align: center;
      font-size: 1.1rem;
      padding: 10px;
      background: rgba(0, 255, 204, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 204, 0.3);
    }
    
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1d3a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    
    .leaderboard-table th,
    .leaderboard-table td {
      padding: 12px 8px;
      text-align: left;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }
    
    .leaderboard-table th {
      background: #111335;
      cursor: pointer;
      font-weight: 600;
      color: #00ffcc;
      transition: background-color 0.2s ease;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .leaderboard-table th:hover {
      background: #1a1a3a;
    }
    
    .leaderboard-table tr:nth-child(even) {
      background-color: #1e2147;
    }
    
    .leaderboard-table tr:hover {
      background-color: #252951;
    }
    
    .highlight {
      background-color: rgba(0, 255, 204, 0.2) !important;
      border: 1px solid rgba(0, 255, 204, 0.5);
    }
    
    .rank-cell {
      font-weight: bold;
      color: #00ffcc;
      text-align: center;
      width: 60px;
    }
    
    .username-cell {
      font-weight: 600;
      color: #ffffff;
      min-width: 120px;
    }
    
    .stat-cell {
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      width: 70px;
    }
    
    .percent-cell {
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      width: 70px;
    }
    
    .date-cell {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      width: 80px;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      
      .leaderboard-table th,
      .leaderboard-table td {
        padding: 8px 4px;
        font-size: 12px;
      }
      
      .title {
        font-size: 1.5rem;
      }
      
      .your-rank {
        font-size: 1rem;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Dev Mode Banner -->
  <div id="devBanner" style="display: none; background: #222; color: lime; text-align: center; padding: 8px; font-weight: bold;">
    🧪 Dev Mode Active: Logged in as Putte68!
  </div>
  
  <!-- Top Navigation -->
  <nav style="background-color: #222; padding: 10px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: space-between; align-items: center; margin: -20px -20px 20px -20px;">
    <div style="display: flex; gap: 4px;">
      <a href="index.html" style="color: white; text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 5px; white-space: nowrap;">🏠 Home</a>
      <a href="leaderboard.html" style="color: white; text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 5px; white-space: nowrap;">🏆 Leaderboard</a>
      <a href="friends.html" style="color: white; text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 5px; white-space: nowrap;">👥 Friends</a>
    </div>
    <div style="display: flex; gap: 4px;">
      <a href="users.html" id="adminUsersLink" style="color: #00ffcc; text-decoration: none; font-weight: bold; font-size: 10px; padding: 3px 6px; border-radius: 4px; white-space: nowrap;">🛡️ Admin</a>
      <a href="#" id="logoutLink" style="color: white; text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 5px; white-space: nowrap;">🚪 Logout</a>
    </div>
  </nav>

  <div class="leaderboard-container">
    <div class="title">🏆 Leaderboard</div>
    <div class="your-rank" id="yourRank">Your Rank: (coming soon)</div>

    <table class="leaderboard-table">
      <thead>
        <tr>
          <th class="rank-cell">Rank</th>
          <th class="username-cell" data-column="username" data-type="string" data-order="asc">User</th>
          <th class="stat-cell" data-column="qpd" data-type="number" data-order="asc">Qpd</th>
          <th class="stat-cell" data-column="nansw" data-type="number" data-order="asc">#answ</th>
          <th class="stat-cell" data-column="ncansw" data-type="number" data-order="asc">#cansw</th>
          <th class="percent-cell" data-column="pcansw" data-type="number" data-order="asc">%cansw</th>
          <th class="stat-cell" data-column="nallc" data-type="number" data-order="asc">#allc</th>
          <th class="percent-cell" data-column="pallc" data-type="number" data-order="asc">%allc</th>
          <th class="stat-cell" data-column="flame" data-type="number" data-order="asc">🔥</th>
          <th class="date-cell" data-column="reg" data-type="string" data-order="asc">Reg</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <!-- Data rows will be inserted here -->
      </tbody>
    </table>
  </div>

  <script>
    // Check dev mode first
    const devMode = localStorage.getItem('mimirDevMode') === 'true';
    if (devMode) {
      const banner = document.getElementById('devBanner');
      if (banner) banner.style.display = 'block';
    }
    
    // Check login status
    const loggedIn = localStorage.getItem('mimirIsLoggedIn') === 'true';
    const username = localStorage.getItem('mimirUsername');
    
    if (!loggedIn || !username) {
      window.location.href = 'index.html';
    }

    // Add logout functionality
    document.getElementById('logoutLink')?.addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('mimirIsLoggedIn');
      localStorage.removeItem('mimirUsername');
      window.location.href = 'index.html';
    });

    // Placeholder for future data loading
    console.log('Leaderboard base structure loaded');</script>

  <!-- Load leaderboard data functionality -->
  <script src="scripts/leaderboard.js"></script>
  </script>
</body>
</html>

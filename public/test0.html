        // Levenshtein distance calculation for fuzzy matching
        function levenshteinDistance(str1, str2) {
            const matrix = [];
            
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            
            return matrix[str2.length][str1.length];
        }

        // Calculate similarity percentage using Levenshtein distance
        function calculateSimilarity(str1, str2) {
            const maxLength = Math.max(str1.length, str2.length);
            if (maxLength === 0) return 100;
            
            const distance = levenshteinDistance(str1.toLowerCase(), str2.toLowerCase());
            return ((maxLength - distance) / maxLength) * 100;
        }

        // Fast duplicate detection with auto-deletion
        async function checkDuplicates() {
            console.log('🔍 Starting fast duplicate detection and cleanup...');
            showToast('Scanning and cleaning duplicates...', 'warning');

            try {
                // Fetch all questions from the database
                const response = await fetch('/api/questions/admin/all');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const questions = data.questions || [];
                const initialCount = questions.length;

                console.log(`📊 Scanning ${initialCount} total questions for duplicates`);

                const duplicatesToDelete = [];
                const deletedInfo = [];
                const processed = new Set();

                // Check for exact duplicates (case-insensitive)
                const exactSeen = new Map();
                
                questions.forEach(question => {
                    // Skip very short questions
                    if (question.question.trim().length < 10) return;
                    
                    const normalizedText = question.question.toLowerCase().trim();
                    
                    if (exactSeen.has(normalizedText)) {
                        const original = exactSeen.get(normalizedText);
                        duplicatesToDelete.push(question._id);
                        deletedInfo.push({
                            id: question._id,
                            type: 'exact',
                            text: question.question.substring(0, 50) + '...',
                            category: question.category
                        });
                        console.log(`🔴 Exact duplicate found: "${question.question.substring(0, 30)}..." (${question.category})`);
                    } else {
                        exactSeen.set(normalizedText, question);
                    }
                });

                // Check for similar duplicates using Levenshtein distance (90%+ similarity)
                for (let i = 0; i < questions.length; i++) {
                    if (processed.has(i) || duplicatesToDelete.includes(questions[i]._id)) continue;
                    
                    const question1 = questions[i];
                    
                    // Skip very short questions
                    if (question1.question.trim().length < 10) continue;
                    
                    for (let j = i + 1; j < questions.length; j++) {
                        if (processed.has(j) || duplicatesToDelete.includes(questions[j]._id)) continue;
                        
                        const question2 = questions[j];
                        
                        // Skip very short questions
                        if (question2.question.trim().length < 10) continue;
                        
                        const similarity = calculateSimilarity(question1.question, question2.question);
                        
                        if (similarity >= 90) {
                            duplicatesToDelete.push(question2._id);
                            deletedInfo.push({
                                id: question2._id,
                                type: 'similar',
                                text: question2.question.substring(0, 50) + '...',
                                category: question2.category,
                                similarity: Math.round(similarity)
                            });
                            processed.add(j);
                            console.log(`🟡 Similar duplicate found (${Math.round(similarity)}%): "${question2.question.substring(0, 30)}..." (${question2.category})`);
                        }
                    }
                }

                // Auto-delete all duplicates if any found
                if (duplicatesToDelete.length > 0) {
                    console.log(`🗑️ Auto-deleting ${duplicatesToDelete.length} duplicates:`, deletedInfo);
                    
                    const deleteResponse = await fetch('/api/questions/admin/bulk-delete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ questionIds: duplicatesToDelete })
                    });

                    if (!deleteResponse.ok) {
                        throw new Error(`Failed to delete duplicates: ${deleteResponse.status}`);
                    }

                    const deleteResult = await deleteResponse.json();
                    const remainingQuestions = initialCount - duplicatesToDelete.length;

                    // Log deleted items for transparency
                    console.log(`✅ Successfully deleted ${deleteResult.deletedCount} duplicates:`);
                    deletedInfo.forEach(item => {
                        console.log(`  • [${item.type.toUpperCase()}] ${item.id}: "${item.text}" (${item.category})${item.similarity ? ` - ${item.similarity}%` : ''}`);
                    });

                    // Show success toast
                    const successMessage = `✅ ${initialCount} scanned\n❌ ${duplicatesToDelete.length} duplicates removed\n📊 ${remainingQuestions} questions remaining`;
                    showToast(successMessage, 'success', 6000);

                    // Refresh category counts
                    loadCategoryCounts();

                } else {
                    // No duplicates found
                    console.log('✅ No duplicates found');
                    const cleanMessage = `✅ ${initialCount} scanned\n❌ 0 duplicates removed\n📊 ${initialCount} questions remaining`;
                    showToast(cleanMessage, 'success', 4000);
                }

            } catch (error) {
                console.error('❌ Error during duplicate cleanup:', error);
                showToast('❌ Error during duplicate cleanup.', 'error');
            }
        }

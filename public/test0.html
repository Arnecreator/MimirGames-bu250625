    <script>
        // Toast notification system
        function showToast(message, type = 'success', duration = 4000) {
            const toast = document.getElementById('toast');

            // Handle multiline messages
            if (message.includes('\n')) {
                toast.innerHTML = message.replace(/\n/g, '<br>');
            } else {
                toast.textContent = message;
            }

            toast.className = `toast ${type}`;
            toast.classList.add('show');

            // Use longer duration for detailed messages
            const displayTime = message.length > 60 ? Math.max(duration, 6000) : duration;

            setTimeout(() => {
                toast.classList.remove('show');
            }, displayTime);
        }

        // Load question counts when page loads

            try {
                const response = await fetch('/api/questions/verify');
                const data = await response.json();

                if (data.stats && Array.isArray(data.stats)) {
                    // Create a map of category counts
                    const categoryCounts = {};
                    data.stats.forEach(stat => {
                        categoryCounts[stat._id] = stat.count;
                    });

                    // Update add buttons with counts
                    const addButtons = document.querySelectorAll('.add-btn[data-category]');
                    addButtons.forEach(button => {
                        const category = button.getAttribute('data-category');
                        const count = categoryCounts[category] || 0;
                        button.textContent = `Add to ${category} (${count})`;
                    });

                    // Update delete buttons with counts
                    const deleteButtons = document.querySelectorAll('.delete-btn[data-category]');
                    deleteButtons.forEach(button => {
                        const category = button.getAttribute('data-category');
                        const count = categoryCounts[category] || 0;
                        button.textContent = `DEL ${category} (${count})`;
                    });

                    console.log('✅ Category counts loaded:', categoryCounts);
                } else {
                    console.warn('⚠️ No category stats found in response');
                }

            } catch (error) {
                console.error('❌ Error loading category counts:', error);
            }
        }

        // Smart duplicate detection with fuzzy matching
        function isSimilar(str1, str2) {
            const normalize = s => s.toLowerCase().replace(/[^\w\s]/gi, '').trim();
            const words1 = normalize(str1).split(' ');
            const words2 = normalize(str2).split(' ');

            const commonWords = words1.filter(word => words2.includes(word));
            const similarity = commonWords.length / Math.max(words1.length, words2.length);

            return similarity > 0.9; // Higher threshold to avoid false positives
        }

        // Global variables to store duplicate results
        let lastDuplicateResults = null;

        // Other Tools functions
        async function checkDuplicates() {
            console.log('🔍 Checking for duplicate questions...');
            showToast('Checking duplicates...', 'warning');

            try {
                // Fetch all questions from the database
                const response = await fetch('/api/questions/admin/all');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const questions = data.questions || [];

                console.log(`📊 Starting smart duplicate check on ${questions.length} total questions`);

                // Check for exact duplicates
                const exactDuplicates = [];
                const exactSeen = new Map();

                questions.forEach(question => {
                    const normalizedText = question.question.toLowerCase().trim();

                    if (exactSeen.has(normalizedText)) {
                        const original = exactSeen.get(normalizedText);
                        exactDuplicates.push({
                            type: 'exact',
                            original: original,
                            duplicate: question,
                            text: normalizedText
                        });
                    } else {
                        exactSeen.set(normalizedText, question);
                    }
                });

                // Check for similar duplicates (fuzzy matching)
                const similarDuplicates = [];
                const processed = new Set();

                for (let i = 0; i < questions.length; i++) {
                    if (processed.has(i)) continue;
                    
                    const question1 = questions[i];
                    
                    for (let j = i + 1; j < questions.length; j++) {
                        if (processed.has(j)) continue;
                        
                        const question2 = questions[j];
                        
                        // Skip if already found as exact duplicate
                        const isExactDupe = exactDuplicates.some(dup => 
                            (dup.original._id === question1._id && dup.duplicate._id === question2._id) ||
                            (dup.original._id === question2._id && dup.duplicate._id === question1._id)
                        );
                        
                        if (!isExactDupe && isSimilar(question1.question, question2.question)) {
                            similarDuplicates.push({
                                type: 'similar',
                                original: question1,
                                duplicate: question2,
                                similarity: calculateSimilarity(question1.question, question2.question)
                            });
                            processed.add(j);
                        }
                    }
                }

                // Calculate summary stats
                const totalQuestions = questions.length;
                const exactCount = exactDuplicates.length;
                const similarCount = similarDuplicates.length;
                const uniqueQuestions = totalQuestions - exactCount - similarCount;

                // Store results for potential review
                lastDuplicateResults = {
                    total: totalQuestions,
                    exact: exactDuplicates,
                    similar: similarDuplicates,
                    unique: uniqueQuestions
                };

                // Log detailed results to console
                console.log(`✅ Smart duplicate check complete:`, {
                    totalQuestions,
                    exactDuplicates: exactCount,
                    similarDuplicates: similarCount,
                    uniqueQuestions,
                    exactDetails: exactDuplicates,
                    similarDetails: similarDuplicates
                });

                // Show read-only results
                const summaryMessage = `🔍 Duplicate Check Complete:\n• ${totalQuestions} questions checked\n• ${exactCount} exact duplicates\n• ${similarCount} similar (over 90% match)\n• ${uniqueQuestions} unique\n✅ No changes were made`;
                
                showToast(summaryMessage, exactCount > 0 || similarCount > 0 ? 'warning' : 'success', 8000);

                // Show action buttons if duplicates found
                if (exactCount > 0 || similarCount > 0) {
                    setTimeout(() => {
                        showDuplicateActions(exactCount, similarCount);
                    }, 1000);
                }

            } catch (error) {
                console.error('❌ Error during duplicate check:', error);
                showToast('❌ Error during duplicate check.', 'error');
            }
        }

        // Calculate similarity percentage for display
        function calculateSimilarity(str1, str2) {
            const normalize = s => s.toLowerCase().replace(/[^\w\s]/gi, '').trim();
            const words1 = normalize(str1).split(' ');
            const words2 = normalize(str2).split(' ');
            const commonWords = words1.filter(word => words2.includes(word));
            return Math.round((commonWords.length / Math.max(words1.length, words2.length)) * 100);
        }

        // Show duplicate action options
        function showDuplicateActions(exactCount, similarCount) {
            let buttons = [];
            
            if (exactCount > 0 || similarCount > 0) {
                buttons.push({
                    text: '📋 Review Duplicates',
                    value: 'review',
                    className: 'swal2-confirm'
                });
            }
            
            if (exactCount > 0) {
                buttons.push({
                    text: '❌ Delete Exact Duplicates (Safe)',
                    value: 'delete-exact',
                    className: 'swal2-deny'
                });
            }
            
            if (similarCount > 0) {
                buttons.push({
                    text: '⚠️ Delete Similar Duplicates (Advanced)',
                    value: 'delete-similar',
                    className: 'swal2-cancel'
                });
            }

            Swal.fire({
                title: 'Duplicate Actions',
                text: `Found ${exactCount} exact and ${similarCount} similar duplicates. What would you like to do?`,
                icon: 'question',
                background: '#1e1e2f',
                color: '#ffffff',
                showCancelButton: true,
                showDenyButton: exactCount > 0,
                showConfirmButton: true,
                confirmButtonText: '📋 Review Duplicates',
                denyButtonText: exactCount > 0 ? '❌ Delete Exact (Safe)' : undefined,
                cancelButtonText: 'Cancel',
                width: '450px',
                customClass: {
                    popup: 'small-confirm-popup',
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    reviewDuplicates();
                } else if (result.isDenied && exactCount > 0) {
                    confirmDeleteExactDuplicates();
                }
            });
        }

        // Review duplicates in a scrollable display
        function reviewDuplicates() {
            if (!lastDuplicateResults) {
                showToast('❌ No duplicate results to review', 'error');
                return;
            }

            let reviewHtml = '<div style="text-align: left; max-height: 400px; overflow-y: auto; font-size: 13px;">';
            
            // Show exact duplicates
            if (lastDuplicateResults.exact.length > 0) {
                reviewHtml += '<h4 style="color: #ff6b6b; margin: 0 0 10px 0;">🔴 Exact Duplicates:</h4>';
                lastDuplicateResults.exact.forEach((dup, index) => {
                    reviewHtml += `
                        <div style="margin-bottom: 15px; padding: 10px; background: rgba(255,107,107,0.1); border-radius: 5px;">
                            <div style="font-weight: bold;">${index + 1}. [${dup.original.category}] vs [${dup.duplicate.category}]</div>
                            <div style="margin: 5px 0; color: #ccc;">"${dup.original.question}"</div>
                            <div style="margin: 5px 0; color: #ccc; padding-left: 20px;">≡ "${dup.duplicate.question}"</div>
                        </div>
                    `;
                });
            }

            // Show similar duplicates
            if (lastDuplicateResults.similar.length > 0) {
                reviewHtml += '<h4 style="color: #f39c12; margin: 15px 0 10px 0;">🟡 Similar Duplicates:</h4>';
                lastDuplicateResults.similar.forEach((dup, index) => {
                    reviewHtml += `
                        <div style="margin-bottom: 15px; padding: 10px; background: rgba(243,156,18,0.1); border-radius: 5px;">
                            <div style="font-weight: bold;">${index + 1}. [${dup.original.category}] vs [${dup.duplicate.category}] (${dup.similarity}% match)</div>
                            <div style="margin: 5px 0; color: #ccc;">"${dup.original.question}"</div>
                            <div style="margin: 5px 0; color: #ccc; padding-left: 20px;">≈ "${dup.duplicate.question}"</div>
                        </div>
                    `;
                });
            }

            reviewHtml += '</div>';

            Swal.fire({
                title: 'Duplicate Review',
                html: reviewHtml,
                background: '#1e1e2f',
                color: '#ffffff',
                width: '700px',
                showConfirmButton: true,
                confirmButtonText: 'Close',
                customClass: {
                    popup: 'small-confirm-popup',
                }
            });
        }

        // Confirm deletion of exact duplicates only
        function confirmDeleteExactDuplicates() {
            if (!lastDuplicateResults || lastDuplicateResults.exact.length === 0) {
                showToast('❌ No exact duplicates to delete', 'error');
                return;
            }

            Swal.fire({
                title: 'Delete Exact Duplicates?',
                text: `This will delete ${lastDuplicateResults.exact.length} exact duplicate questions. This action cannot be undone.`,
                icon: 'warning',
                background: '#1e1e2f',
                color: '#ffffff',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete exact duplicates',
                cancelButtonText: 'Cancel',
                width: '400px',
                customClass: {
                    popup: 'small-confirm-popup',
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    removeDuplicates(lastDuplicateResults.exact, lastDuplicateResults.total, lastDuplicateResults.exact.length);
                }
            });
        }

        // Remove duplicates function
        async function removeDuplicates(duplicates, totalQuestions, duplicatesFound) {
            try {
                showToast('Removing duplicates...', 'warning');

                // Extract duplicate IDs to delete (keep the original, delete the duplicate)
                const duplicateIds = duplicates.map(dup => dup.duplicate._id);

                console.log(`🗑️ Removing ${duplicateIds.length} duplicate questions:`, duplicateIds);

                // Send DELETE request to remove duplicates
                const response = await fetch('/api/questions/admin/bulk-delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ questionIds: duplicateIds })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                const remainingQuestions = totalQuestions - duplicatesFound;

                // Show success message
                const successMessage = `✅ Duplicate cleanup complete\n• ${duplicatesFound} duplicates removed\n• ${remainingQuestions} unique questions remain`;
                showToast(successMessage, 'success', 6000);

                console.log(`✅ Successfully removed ${result.deletedCount || duplicatesFound} duplicates`);

                // Refresh category counts
                loadCategoryCounts();

            } catch (error) {
                console.error('❌ Error removing duplicates:', error);
                showToast('❌ Error removing duplicates. Please try again.', 'error');
            }

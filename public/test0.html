            // Use longer duration for detailed messages

        // Simplified Levenshtein distance calculation for fuzzy matching
        function levenshteinDistance(str1, str2) {
            const matrix = [];
            
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            
            return matrix[str2.length][str1.length];
        }

        // Calculate similarity percentage using Levenshtein distance
        function calculateSimilarity(str1, str2) {
            const maxLength = Math.max(str1.length, str2.length);
            if (maxLength === 0) return 100;
            
            const distance = levenshteinDistance(str1.toLowerCase(), str2.toLowerCase());
            return ((maxLength - distance) / maxLength) * 100;
        }

        // Check duplicates with confirmation dialog before deletion
        async function checkDuplicates() {
            console.log('🔍 Starting duplicate check...');
            showToast('Scanning for duplicates...', 'warning');

            try {
                // Fetch all questions from the database
                const response = await fetch('/api/questions/admin/all');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const questions = data.questions || [];
                const initialCount = questions.length;

                console.log(`📊 Scanning ${initialCount} questions for duplicates`);

                const exactDuplicates = [];
                const similarDuplicates = [];
                const processed = new Set();

                // Phase 1: Detect exact duplicates (case-insensitive)
                const exactSeen = new Map();
                
                questions.forEach(question => {
                    // Skip very short questions to avoid false positives
                    if (question.question.trim().length < 10) return;
                    
                    const normalizedText = question.question.toLowerCase().trim();
                    
                    if (exactSeen.has(normalizedText)) {
                        exactDuplicates.push({
                            id: question._id,
                            text: question.question,
                            category: question.category,
                            originalId: exactSeen.get(normalizedText)._id
                        });
                    } else {
                        exactSeen.set(normalizedText, question);
                    }
                });

                // Phase 2: Detect similar duplicates using fuzzy matching (90%+ threshold)
                for (let i = 0; i < questions.length; i++) {
                    if (processed.has(i)) continue;
                    
                    const question1 = questions[i];
                    
                    // Skip very short questions
                    if (question1.question.trim().length < 10) continue;
                    
                    for (let j = i + 1; j < questions.length; j++) {
                        if (processed.has(j)) continue;
                        
                        const question2 = questions[j];
                        
                        // Skip very short questions
                        if (question2.question.trim().length < 10) continue;
                        
                        const similarity = calculateSimilarity(question1.question, question2.question);
                        
                        if (similarity >= 90 && similarity < 100) {
                            // Only add if not already marked as exact duplicate
                            const isExactDuplicate = exactDuplicates.some(dup => dup.id === question2._id);
                            if (!isExactDuplicate) {
                                similarDuplicates.push({
                                    id: question2._id,
                                    text: question2.question,
                                    category: question2.category,
                                    similarity: Math.round(similarity),
                                    originalText: question1.question,
                                    originalCategory: question1.category
                                });
                                processed.add(j);
                            }
                        }
                    }
                }

                // Show results and get user confirmation
                await showDuplicateResults(initialCount, exactDuplicates, similarDuplicates);

            } catch (error) {
                console.error('❌ Duplicate check error:', error);
                showToast('❌ Duplicate check failed', 'error');
            }
        }

        // Delete exact duplicates only
        async function deleteExactDuplicates(exactDuplicates, totalQuestions) {
            if (exactDuplicates.length === 0) {
                showToast('No exact duplicates to delete', 'warning');
                return;
            }

            try {
                showToast('Deleting exact duplicates...', 'warning');

                const idsToDelete = exactDuplicates.map(dup => dup.id);
                
                const deleteResponse = await fetch('/api/questions/admin/bulk-delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ questionIds: idsToDelete })
                });

                if (!deleteResponse.ok) {
                    throw new Error(`Failed to delete duplicates: ${deleteResponse.status}`);
                }

                const deleteResult = await deleteResponse.json();
                const remainingQuestions = totalQuestions - deleteResult.deletedCount;

                // Console logging for transparency
                console.log(`✅ Deleted ${deleteResult.deletedCount} exact duplicates:`);
                exactDuplicates.forEach(item => {
                    console.log(`  • [EXACT] ${item.id}: "${item.text.substring(0, 40)}..." (${item.category})`);
                });

                // Show success modal
                await Swal.fire({
                    title: 'Cleanup Complete',
                    html: `
                        <div style="text-align: left; margin: 10px 0;">
                            <p><strong>✅ Exact duplicates removed:</strong> ${deleteResult.deletedCount}</p>
                            <p><strong>📊 Questions remaining:</strong> ${remainingQuestions}</p>
                            <p><strong>🔍 Categories cleaned:</strong> ${[...new Set(exactDuplicates.map(d => d.category))].join(', ')}</p>
                        </div>
                    `,
                    icon: 'success',
                    background: '#1e1e2f',
                    color: '#ffffff',
                    confirmButtonColor: '#28a745',
                    confirmButtonText: 'OK'
                });

                // Refresh category counts

                showToast('❌ Failed to delete duplicates', 'error');
            }
        }

            document.querySelectorAll('.add-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const category = this.getAttribute('data-category');
                    addQuestions(category);
                });
            });

            // Delete button event listeners
            document.querySelectorAll('.delete-btn[data-category]').forEach(button => {
                button.addEventListener('click', function() {
                    const category = this.getAttribute('data-category');
                    Swal.fire({
                        title: `Delete all questions from ${category}?`,
                        text: 'This action cannot be undone.',
                        icon: 'warning',
                        background: '#1e1e2f',
                        color: '#ffffff',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#3085d6',
                        confirmButtonText: 'Yes, delete them!',
                        cancelButtonText: 'Cancel',
                        width: '350px',
                        customClass: {
                            popup: 'small-confirm-popup',
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            deleteQuestions(category);
                        }
                    });
                });
            });

            // Special buttons
            document.getElementById('add-all-btn').addEventListener('click', addToAllCategories);
            document.getElementById('delete-all-btn').addEventListener('click', function() {
                Swal.fire({
                    title: 'Delete ALL categories?',
                    text: 'This will permanently delete ALL questions from ALL categories. This cannot be undone!',
                    icon: 'warning',
                    background: '#1e1e2f',
                    color: '#ffffff',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Yes, delete everything!',
                    cancelButtonText: 'Cancel',
                    width: '350px',
                    customClass: {
                        popup: 'small-confirm-popup',
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        deleteAllCategories();
                    }
                });
            });
        });
    </script>

    <script src="scripts/global.js"></script>
</body>
</html>


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Registered Users – Mimir Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles/main.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #0a0b1e;
        color: white;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }

      .page-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .page-title {
        font-size: 2rem;
        font-weight: 800;
        color: #00ffcc;
        margin-bottom: 10px;
      }

      .page-subtitle {
        color: #aaa;
        font-size: 14px;
        margin: 0;
      }

      .users-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .user-card {
        background: #1a1d3a;
        border-radius: 10px;
        padding: 20px;
        transition: transform 0.2s ease-in-out;
        border: 1px solid #333;
      }

      .user-card:hover {
        transform: translateY(-2px);
        border-color: #00ffcc;
      }

      .user-icon {
        font-size: 24px;
        margin-bottom: 10px;
        display: block;
      }

      .user-username {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 5px;
      }

      .user-email {
        font-size: 14px;
        color: #aaa;
        word-break: break-all;
      }

      .user-status {
        display: inline-block;
        padding: 3px 8px;
        background: #666666;
        color: #cccccc;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
        margin-top: 8px;
      }

      .empty-state {
        background: #1a1d3a;
        border-radius: 10px;
        padding: 40px 20px;
        text-align: center;
        border: 1px solid #333;
        max-width: 400px;
        margin: 40px auto;
      }

      .empty-icon {
        font-size: 48px;
        margin-bottom: 15px;
        opacity: 0.6;
      }

      .empty-title {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 8px;
      }

      .empty-message {
        color: #aaa;
        font-size: 14px;
        line-height: 1.4;
      }

      .error-state {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid #ef4444;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        max-width: 400px;
        margin: 40px auto;
      }

      .error-icon {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .error-message {
        color: #ff6b6b;
        font-size: 14px;
      }

      .loading-state {
        background: #1a1d3a;
        border-radius: 10px;
        padding: 40px 20px;
        text-align: center;
        border: 1px solid #333;
        max-width: 400px;
        margin: 40px auto;
      }

      .loading-spinner {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid #333;
        border-radius: 50%;
        border-top-color: #00ffcc;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 15px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        color: #aaa;
        font-size: 14px;
      }

      .back-button {
        display: inline-block;
        padding: 12px 24px;
        background: #00ffcc;
        color: #000;
        text-decoration: none;
        border-radius: 26px;
        font-weight: bold;
        transition: all 0.2s ease;
        font-size: 14px;
        margin-bottom: 20px;
      }

      .back-button:hover {
        background: #00e6b8;
        transform: translateY(-1px);
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        .page-title {
          font-size: 1.6rem;
        }

        .users-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .user-card {
          padding: 16px;
        }

        .empty-state {
          padding: 30px 20px;
          margin: 30px auto;
        }

        .empty-icon {
          font-size: 36px;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 10px;
        }

        .page-title {
          font-size: 1.4rem;
        }

        .user-card {
          padding: 14px;
        }

        .back-button {
          padding: 10px 20px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="index.html" class="back-button">← Back to Dashboard</a>
      
      <div class="page-header">
        <h1 class="page-title">🛡️ Registered Users</h1>
        <p class="page-subtitle">Admin panel - View all registered users</p>
      </div>

      <div id="loadingState" class="loading-state">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading users...</div>
      </div>

      <div id="usersContainer" class="users-grid" style="display: none;"></div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">👥</div>
        <div class="empty-title">No Users Found</div>
        <div class="empty-message">No registered users in the system yet. Users will appear here once they register.</div>
      </div>

      <div id="errorState" class="error-state" style="display: none;">
        <div class="error-icon">⚠️</div>
        <div id="errorMessage" class="error-message">Something went wrong loading users.</div>
      </div>
    </div>

    <script>
      async function loadUsers() {
        const loadingState = document.getElementById("loadingState");
        const usersContainer = document.getElementById("usersContainer");
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessage = document.getElementById("errorMessage");

        try {
          const response = await fetch("/api/users");
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          const users = await response.json();
          
          // Hide loading state
          loadingState.style.display = "none";
          
          if (users.length === 0) {
            emptyState.style.display = "block";
          } else {
            usersContainer.style.display = "grid";
            usersContainer.innerHTML = users.map(user => `
              <div class="user-card">
                <div class="user-icon">👤</div>
                <div class="user-username">${escapeHtml(user.username)}</div>
                <div class="user-email">${user.email ? escapeHtml(user.email) : 'No email provided'}</div>
                <div class="user-status">Active</div>
              </div>
            `).join('');
          }
          
        } catch (error) {
          console.error("Error loading users:", error);
          loadingState.style.display = "none";
          errorState.style.display = "block";
          errorMessage.textContent = error.message;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Load users when page loads
      document.addEventListener("DOMContentLoaded", loadUsers);
    </script>
  </body>
</html>


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Admin Dashboard – Mimir Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Courier New', Monaco, 'Lucida Console', monospace;
        font-size: 10px;
        line-height: 1.2;
        background: #ffffff;
        color: #000000;
        padding: 8px;
      }

      .header {
        margin-bottom: 12px;
        border-bottom: 1px solid #000;
        padding-bottom: 6px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .header .subtitle {
        font-size: 10px;
        color: #666;
      }

      .back-link {
        color: #0066cc;
        text-decoration: none;
        font-size: 10px;
        margin-bottom: 6px;
        display: inline-block;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .table-container {
        overflow-x: auto;
        border: 1px solid #000;
        max-height: 85vh;
        overflow-y: auto;
        width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        min-width: 1000px;
        table-layout: fixed;
      }

      th {
        background: #f0f0f0;
        border: 1px solid #ccc;
        padding: 4px 3px;
        text-align: center;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
        font-size: 9px;
        line-height: 1.1;
      }

      td {
        border: 1px solid #ddd;
        padding: 2px 4px;
        white-space: nowrap;
        vertical-align: middle;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      tr:nth-child(even) {
        background: #f9f9f9;
      }

      tr:hover {
        background: #e6f3ff;
      }

      /* Fixed column widths */
      .col-user { width: 90px; }
      .col-mail { width: 120px; }
      .col-pwd { width: 80px; }
      .col-games { width: 60px; }
      .col-corr { width: 60px; }
      .col-full { width: 50px; }
      .col-fs-pct { width: 50px; }
      .col-streak { width: 60px; }
      .col-frnd { width: 50px; }
      .col-created { width: 80px; }
      .col-actions { width: 70px; }

      .username {
        font-weight: bold;
      }

      .email {
        color: #333;
      }

      .password {
        font-family: monospace;
        color: #666;
        font-size: 9px;
      }

      .stats-num {
        text-align: center;
        font-family: monospace;
      }

      .date {
        font-size: 9px;
        color: #666;
      }

      .actions {
        white-space: nowrap;
        text-align: center;
      }

      .btn {
        background: none;
        border: 1px solid #666;
        padding: 1px 3px;
        margin: 0 1px;
        cursor: pointer;
        font-size: 8px;
        line-height: 1;
      }

      .btn:hover {
        background: #ddd;
      }

      .btn-delete {
        color: #cc0000;
        border-color: #cc0000;
      }

      .btn-delete:hover {
        background: #ffeeee;
      }

      .btn-edit {
        color: #0066cc;
        border-color: #0066cc;
      }

      .btn-edit:hover {
        background: #eef6ff;
      }

      .loading, .empty, .error {
        text-align: center;
        padding: 20px;
        font-size: 11px;
      }

      .error {
        color: #cc0000;
      }

      @media (max-width: 768px) {
        body {
          padding: 4px;
          font-size: 9px;
        }
        
        table {
          font-size: 9px;
          min-width: 800px;
        }
        
        th, td {
          padding: 1px 2px;
        }
        
        .btn {
          font-size: 7px;
          padding: 1px 2px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="back-link">← Back</a>
      <h1>User Admin Dashboard</h1>
      <div class="subtitle">Internal admin tool - User data management</div>
    </div>

    <div id="loadingState" class="loading">Loading users...</div>

    <div id="tableContainer" class="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th class="col-user">User</th>
            <th class="col-mail">Mail</th>
            <th class="col-pwd">Pwd</th>
            <th class="col-games">Games</th>
            <th class="col-corr">Corr<br>Ans</th>
            <th class="col-full">Full</th>
            <th class="col-fs-pct">FS %</th>
            <th class="col-streak">Streak</th>
            <th class="col-frnd">Frnd</th>
            <th class="col-created">Created</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable">
        </tbody>
      </table>
    </div>

    <div id="emptyState" class="empty" style="display: none;">No users found.</div>
    <div id="errorState" class="error" style="display: none;">
      <span id="errorMessage">Error loading users.</span>
    </div>

    <script>
      async function loadUsers() {
        const loadingState = document.getElementById("loadingState");
        const tableContainer = document.getElementById("tableContainer");
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessage = document.getElementById("errorMessage");
        const usersTable = document.getElementById("usersTable");

        try {
          const response = await fetch("/api/users");
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          const users = await response.json();
          
          loadingState.style.display = "none";
          
          // Always show table, even if empty
          tableContainer.style.display = "block";
          
          if (users.length === 0) {
            usersTable.innerHTML = '<tr><td colspan="11" style="text-align: center; padding: 20px; color: #666;">No users found.</td></tr>';
          } else {
            usersTable.innerHTML = users.map(user => `
              <tr>
                <td class="username col-user">${escapeHtml(user.username)}</td>
                <td class="email col-mail">${user.email ? escapeHtml(user.email) : 'N/A'}</td>
                <td class="password col-pwd">${user.plainPassword || 'N/A'}</td>
                <td class="stats-num col-games">${user.gamesPlayed || 0}</td>
                <td class="stats-num col-corr">${user.correctAnswers || 0}</td>
                <td class="stats-num col-full">${user.fullScores || 0}</td>
                <td class="stats-num col-fs-pct">${user.fullScorePercentage || '0%'}</td>
                <td class="stats-num col-streak">${user.bestStreak || 0}</td>
                <td class="stats-num col-frnd">${user.friends ? user.friends.length : 0}</td>
                <td class="date col-created">${user.createdAt ? new Date(user.createdAt).toLocaleDateString('sv-SE') : 'N/A'}</td>
                <td class="actions col-actions">
                  <button class="btn btn-edit" onclick="editUser('${user._id}')" title="Edit">✏️</button>
                  <button class="btn btn-delete" onclick="deleteUser('${user._id}', '${escapeHtml(user.username)}')" title="Delete">🗑️</button>
                </td>
              </tr>
            `).join('');
          }
          
        } catch (error) {
          console.error("Error loading users:", error);
          loadingState.style.display = "none";
          errorState.style.display = "block";
          errorMessage.textContent = error.message;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function editUser(userId) {
        alert(`Edit user functionality coming soon. User ID: ${userId}`);
        // TODO: Implement edit functionality
      }

      function deleteUser(userId, username) {
        if (confirm(`Delete user "${username}"? This action cannot be undone.`)) {
          alert(`Delete functionality coming soon. User ID: ${userId}`);
          // TODO: Implement delete functionality
          // fetch(`/api/users/${userId}`, { method: 'DELETE' })
        }
      }

      // Load users when page loads
      document.addEventListener("DOMContentLoaded", loadUsers);

      // Auto-refresh every 30 seconds
      setInterval(loadUsers, 30000);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Admin Dashboard – Mimir Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", Monaco, "Lucida Console", monospace;
        font-size: 10px;
        line-height: 1;
        background: #ffffff;
        color: #000000;
        padding: 4px;
      }

      .header {
        margin-bottom: 5px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 2px;
      }

      .header h1 {
        font-size: 16px;
        font-weight: 600;
        color: #7fffd4;
        margin: 0;
      }

      .header .subtitle {
        font-size: 9px;
        color: #666;
      }

      .back-link {
        color: #0066cc;
        text-decoration: none;
        font-size: 9px;
        margin-bottom: 5px;
        display: inline-block;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .table-container {
        overflow-x: auto;
        overflow-y: auto;
        border: 1px solid #ccc;
        max-height: 90vh;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        font-family: "Courier New", Monaco, monospace;
      }

      table th {
        background: #111335;
        font-weight: 600;
        color: #7fffd4;
        position: sticky;
        top: 0;
        z-index: 10;
        cursor: pointer;
        user-select: none;
      }

      td {
        border: 1px solid #ddd;
        border-top: 1px solid #e0e0e0;
        border-bottom: 1px solid #e0e0e0;
        padding: 2px 4px;
        text-align: left;
        max-width: 100px;
        min-width: 25px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1;
        cursor: pointer; /* Add this line */
      }

      tr:nth-child(even) {
        background: #f9f9f9;
      }

      tr:hover {
        background: #f1f1f1;
      }

      .col-id {
        max-width: 60px;
        font-size: 9px;
        color: #666;
      }

      .col-user {
        max-width: 80px;
        font-weight: bold;
      }

      .col-psw {
        max-width: 70px;
        font-size: 9px;
        color: #666;
      }

      .col-mail {
        max-width: 120px;
        font-size: 9px;
      }

      .col-friends {
        max-width: 40px;
      }

      .col-num {
        max-width: 50px;
        text-align: left;
      }

      .col-perc {
        max-width: 50px;
        text-align: left;
      }

      .col-date {
        max-width: 80px;
        font-size: 9px;
      }

      .col-info {
        max-width: 40px;
        min-width: 25px;
        font-size: 9px;
        color: #888;
        text-align: left;
      }

      .col-actions {
        max-width: 60px;
        min-width: 50px;
        text-align: left;
      }

      .inline-input {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: inherit;
        border: 1px solid #007bff;
        background: #fff;
        color: #000;
        padding: 1px 2px;
      }

      .edit-btn,
      .delete-btn {
        background: none;
        border: none;
        font-size: 11px;
        cursor: pointer;
        padding: 1px 2px;
        margin: 0 1px;
        border-radius: 2px;
        transition: background-color 0.2s;
      }

      .edit-btn:hover {
        background: rgba(0, 123, 255, 0.1);
      }

      .delete-btn:hover {
        background: rgba(220, 53, 69, 0.1);
      }

      .loading,
      .empty,
      .error {
        text-align: center;
        padding: 20px;
        font-size: 10px;
      }

      .error {
        color: #cc0000;
      }

      @media (max-width: 768px) {
        body {
          padding: 4px;
          font-size: 9px;
        }

        table {
          font-size: 9px;
        }

        th,
        td {
          padding: 1px 2px;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shared Topbar -->
    <div id="topbar-placeholder"></div>
    <script>
      fetch("/components/topbar.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("topbar-placeholder").innerHTML = html;
        });
    </script>

    <div class="header">
      <a href="index.html" class="back-link" style="margin-right: 8px">🏠</a>
      <a href="javascript:history.back()" class="back-link">← Back</a>
      <span id="version-label" style="font-size: 10px; color: gray; margin: 2px 0 0 0; display: inline-block; margin-left: 10px;">
        Version: ...
      </span>
      <h1>User Admin Dashboard</h1>
      <div class="subtitle">Compact admin table - Maximum data density</div>
    </div>

    <div id="loadingState" class="loading">Loading users...</div>

    <div id="tableContainer" class="table-container" style="display: none">
      <table>
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th class="col-user">User</th>
            <th class="col-psw">psw</th>
            <th class="col-mail">mail</th>
            <th class="col-num">Qpd</th>
            <th class="col-num">#answ</th>
            <th class="col-num">#cansw</th>
            <th class="col-perc">%cansw</th>
            <th class="col-num">#allc</th>
            <th class="col-perc">%allc</th>
            <th class="col-num">🔥</th>
            <th class="col-date">Reg</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>

    <div id="emptyState" class="empty" style="display: none">
      No users found.
    </div>
    <div id="errorState" class="error" style="display: none">
      <span id="errorMessage">Error loading users.</span>
    </div>

    <script>
      async function loadUsers() {
        const loadingState = document.getElementById("loadingState");
        const tableContainer = document.getElementById("tableContainer");
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessage = document.getElementById("errorMessage");
        const usersTable = document.getElementById("usersTable");

        try {
          // Use relative URL to work with current domain
          const response = await fetch("/api/users");

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const users = await response.json();
          console.log("Loaded users:", users);

          loadingState.style.display = "none";

          if (users.length === 0) {
            emptyState.style.display = "block";
          } else {
            tableContainer.style.display = "block";
            usersTable.innerHTML = users
              .map((user) => {
                // Calculate derived values
                const gamesPlayed = user.gamesPlayed || 0;
                const totalAnswers = gamesPlayed * 8;
                const correctAnswers = user.correctAnswers || 0;
                const correctPercentage =
                  totalAnswers > 0
                    ? Math.round((correctAnswers / totalAnswers) * 100)
                    : 0;
                const fullScores = user.fullScores || 0;
                const fullPercentage =
                  gamesPlayed > 0
                    ? Math.round((fullScores / gamesPlayed) * 100)
                    : 0;

                // Format date to YYMMDD
                let regDate = "------";
                if (user.createdAt) {
                  try {
                    const date = new Date(user.createdAt);
                    const year = date.getFullYear().toString().slice(-2);
                    const month = (date.getMonth() + 1)
                      .toString()
                      .padStart(2, "0");
                    const day = date.getDate().toString().padStart(2, "0");
                    regDate = year + month + day;
                  } catch (e) {
                    regDate = "------";
                  }
                }

                // Show plaintext password from your auth system (if available)
                const plainPassword = user.plainPassword || "hidden";

                return `
                <tr>
                  <td class="col-id">${user._id ? user._id.slice(-6) : "-"}</td>
                  <td class="col-user" ondblclick="makeInlineEditable(this, '${user._id}', 'username', '${escapeHtml(user.username || "")}')">${escapeHtml(user.username || "-")}</td>
                  <td class="col-psw" onclick="makeCellEditable(this, 'plainPassword', '${user._id}')">${escapeHtml(plainPassword)}</td>
                  <td class="col-mail" ondblclick="makeInlineEditable(this, '${user._id}', 'email', '${escapeHtml(user.email || "")}')">${user.email ? escapeHtml(user.email) : "-"}</td>
                  <td class="col-num">${user.quizPlayedDays || user.gamesPlayed || 0}</td>
                  <td class="col-num">${user.quizAnswers || totalAnswers}</td>
                  <td class="col-num">${user.quizCorrect || correctAnswers}</td>
                  <td class="col-perc">${user.quizPercentCorrect || correctPercentage}%</td>
                  <td class="col-num">${user.quizFullScoreGames || fullScores}</td>
                  <td class="col-perc">${calculateFullScorePercent(user)}%</td>
                  <td class="col-num">${user.quizStreak || user.bestStreak || 0}</td>
                  <td class="col-date">${regDate}</td>
                  <td class="col-actions">
                    <button class="edit-btn" onclick="openEditModal('${user._id}', '${escapeHtml(user.username || "")}', '${escapeHtml(user.plainPassword || "")}', '${escapeHtml(user.email || "")}')">✏️</button>
                    <button class="delete-btn" onclick="deleteUser('${user._id}')">🗑️</button>
                  </td>
                </tr>
              `;
              })
              .join("");
          }
        } catch (error) {
          console.error("Error loading users:", error);
          loadingState.style.display = "none";
          errorState.style.display = "block";
          errorMessage.textContent = error.message;
        }
      }

      // Escape HTML to prevent XSS
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Calculate full score percentage
      function calculateFullScorePercent(user) {
        const playedDays = user.quizPlayedDays || user.gamesPlayed || 0;
        const fullScoreGames = user.quizFullScoreGames || user.fullScores || 0;
        if (!playedDays || playedDays === 0) return 0;
        return Math.round((fullScoreGames / playedDays) * 100);
      }

      // Make cell editable for inline editing (double-click for username/email)
      function makeInlineEditable(td, userId, field, originalValue) {
        const input = document.createElement("input");
        input.type = "text";
        input.value = originalValue;
        input.classList.add("inline-input");

        td.textContent = "";
        td.appendChild(input);
        input.focus();
        input.select();

        input.addEventListener("keydown", async (e) => {
          if (e.key === "Enter") {
            const newValue = input.value.trim();
            try {
              const res = await fetch(`/api/users/${userId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ [field]: newValue })
              });
              if (!res.ok) throw new Error("Update failed");
              td.textContent = newValue || "-";

              Swal.fire({
                title: 'Updated!',
                text: `${field} updated successfully.`,
                icon: 'success',
                timer: 1000,
                showConfirmButton: false
              });
            } catch (err) {
              td.textContent = originalValue || "-";
              Swal.fire({
                title: 'Error!',
                text: 'Failed to update: ' + err.message,
                icon: 'error',
                confirmButtonText: 'OK'
              });
            }
          } else if (e.key === "Escape") {
            td.textContent = originalValue || "-";
          }
        });

        input.addEventListener("blur", () => {
          if (td.contains(input)) {
            td.textContent = originalValue || "-";
          }
        });
      }

      // Make cell editable for inline editing
      function makeCellEditable(td, field, userId) {
        const originalText = td.textContent;
        const input = document.createElement("input");
        input.type = "text";
        input.value = originalText;
        input.style.width = "100%";
        input.style.fontSize = "inherit";
        input.style.border = "1px solid #ccc";
        input.style.padding = "2px";
        input.style.fontFamily = "inherit";

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            input.blur();
          }
          if (event.key === "Escape") {
            td.textContent = originalText;
            td.style.cursor = 'pointer';
          }
        });

        input.addEventListener("blur", () => {
          const newValue = input.value.trim();
          td.textContent = newValue;
          td.style.cursor = 'pointer';

          if (newValue !== originalText && newValue !== "") {
            fetch(`/api/users/${userId}`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ [field]: newValue }),
            })
            .then((res) => {
              if (!res.ok) {
                Swal.fire({
                  title: 'Error!',
                  text: 'Failed to update user.',
                  icon: 'error',
                  confirmButtonText: 'OK'
                });
                td.textContent = originalText;
              } else {
                Swal.fire({
                  title: 'Updated!',
                  text: 'User updated successfully.',
                  icon: 'success',
                  timer: 1000,
                  showConfirmButton: false
                });
              }
            })
            .catch(() => {
              Swal.fire({
                title: 'Error!',
                text: 'Network error occurred.',
                icon: 'error',
                confirmButtonText: 'OK'
              });
              td.textContent = originalText;
            });
          } else if (newValue === "") {
            td.textContent = originalText;
          }
        });

        td.textContent = "";
        td.appendChild(input);
        input.focus();
        input.select();
      }

      // Open edit modal function
      async function openEditModal(userId, currentUsername, currentPassword, currentEmail) {
        const { value: formValues } = await Swal.fire({
          title: 'Edit User',
          html: `
            <div style="text-align: left; margin: 10px 0;">
              <label for="edit-username" style="display: block; margin-bottom: 5px; font-weight: bold;">Username:</label>
              <input id="edit-username" class="swal2-input" placeholder="Username" value="${currentUsername}" style="margin: 0;">
            </div>
            <div style="text-align: left; margin: 10px 0;">
              <label for="edit-password" style="display: block; margin-bottom: 5px; font-weight: bold;">Password:</label>
              <input id="edit-password" class="swal2-input" placeholder="Password" value="${currentPassword}" style="margin: 0;">
            </div>
            <div style="text-align: left; margin: 10px 0;">
              <label for="edit-email" style="display: block; margin-bottom: 5px; font-weight: bold;">Email:</label>
              <input id="edit-email" class="swal2-input" placeholder="Email" value="${currentEmail}" style="margin: 0;">
            </div>
          `,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: 'Save Changes',
          cancelButtonText: 'Cancel',
          confirmButtonColor: '#007bff',
          cancelButtonColor: '#6c757d',
          preConfirm: () => {
            const username = document.getElementById('edit-username').value.trim();
            const password = document.getElementById('edit-password').value.trim();
            const email = document.getElementById('edit-email').value.trim();

            if (!username) {
              Swal.showValidationMessage('Username is required');
              return false;
            }
            if (!password) {
              Swal.showValidationMessage('Password is required');
              return false;
            }

            return { username, password, email };
          }
        });

        if (formValues) {
          try {
            const response = await fetch(`/api/users/${userId}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: formValues.username,
                plainPassword: formValues.password,
                email: formValues.email
              })
            });

            if (response.ok) {
              Swal.fire({
                title: 'Success!',
                text: 'User updated successfully.',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
              });
              setTimeout(() => loadUsers(), 600); // refresh the table
            } else {
              throw new Error('Failed to update user');
            }
          } catch (err) {
            console.error("Error updating user:", err);
            Swal.fire({
              title: 'Error!',
              text: 'Failed to update user: ' + err.message,
              icon: 'error',
              confirmButtonText: 'OK'
            });
          }
        }
      }

      // Delete user function
      async function deleteUser(userId) {
        // First get the username for better feedback
        let username = 'User';
        try {
          const userRows = document.querySelectorAll('#usersTable tr');
          userRows.forEach(row => {
            const deleteBtn = row.querySelector(`button[onclick*="${userId}"]`);
            if (deleteBtn) {
              const usernameCell = row.querySelector('.col-user');
              if (usernameCell) {
                username = usernameCell.textContent.trim();
              }
            }
          });
        } catch (e) {
          console.log('Could not extract username for feedback');
        }

        const result = await Swal.fire({
          title: 'Delete user?',
          text: `This will permanently delete ${username} and all their data. This cannot be undone!`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Yes, Delete',
          cancelButtonText: 'Cancel',
          confirmButtonColor: '#dc3545',
          cancelButtonColor: '#6c757d'
        });

        if (result.isConfirmed) {
          try {
            const response = await fetch(`/api/users/${userId}`, {
              method: "DELETE",
            });

            if (response.ok) {
              const data = await response.json();
              console.log('Deletion successful:', data);

              Swal.fire({
                title: 'Deleted!',
                text: `${username} has been removed successfully.`,
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
              }).then(() => {
                loadUsers(); // Refresh the table immediately after success message
              });
            } else {
              const errorData = await response.json();
              Swal.fire({
                title: 'Error!',
                text: errorData.error || 'Failed to delete user.',
                icon: 'error',
                confirmButtonText: 'OK'
              });
            }
          } catch (err) {
            console.error("Error deleting user:", err);
            Swal.fire({
              title: 'Error!',
              text: 'Network error occurred while deleting user.',
              icon: 'error',
              confirmButtonText: 'OK'
            });
          }
        }
      }
      // Load users when page loads
      document.addEventListener("DOMContentLoaded", loadUsers);

      // Auto-refresh every 30 seconds to show new registrations
      setInterval(loadUsers, 30000);

      // Update timestamp dynamically
      function updateTimestamp() {
        const now = new Date();
        const timestamp = now.toLocaleString('sv-SE', {
          dateStyle: 'short',
          timeStyle: 'short',
          hour12: false,
          timeZone: 'Europe/Stockholm'
        }).replace(',', ' kl');
        document.getElementById("version-label").textContent = "Version: " + timestamp;
      }

      // Update timestamp on page load and every minute
      updateTimestamp();
      setInterval(updateTimestamp, 60000);

      // Add logout functionality for navigation bar
      document.getElementById('logoutLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('mimirIsLoggedIn');
        localStorage.removeItem('mimirUsername');
        window.location.href = 'index.html';
      });
    </script>
  </body>
</html>

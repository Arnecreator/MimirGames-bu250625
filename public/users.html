
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Admin Dashboard – Mimir Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Courier New', Monaco, 'Lucida Console', monospace;
        font-size: 10px;
        line-height: 1;
        background: #ffffff;
        color: #000000;
        padding: 4px;
      }

      .header {
        margin-bottom: 5px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 2px;
      }

      .header h1 {
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .header .subtitle {
        font-size: 9px;
        color: #666;
      }

      .back-link {
        color: #0066cc;
        text-decoration: none;
        font-size: 9px;
        margin-bottom: 5px;
        display: inline-block;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .table-container {
        overflow-x: auto;
        overflow-y: auto;
        border: 1px solid #ccc;
        max-height: 90vh;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        font-family: 'Courier New', Monaco, monospace;
      }

      th {
        background: #f5f5f5;
        border: 1px solid #ccc;
        padding: 1px 2px;
        text-align: left;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
        max-width: 100px;
        min-width: 30px;
        line-height: 1;
      }

      td {
        border: 1px solid #ddd;
        padding: 0px 2px;
        text-align: left;
        max-width: 100px;
        min-width: 30px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1;
      }

      tr:nth-child(even) {
        background: #fafafa;
      }

      tr:hover {
        background: #f0f0f0;
      }

      .col-id {
        max-width: 60px;
        font-size: 9px;
        color: #666;
      }

      .col-user {
        max-width: 80px;
        font-weight: bold;
      }

      .col-psw {
        max-width: 70px;
        font-size: 9px;
        color: #666;
      }

      .col-mail {
        max-width: 120px;
        font-size: 9px;
      }

      .col-friends {
        max-width: 40px;
      }

      .col-num {
        max-width: 50px;
        text-align: center;
      }

      .col-perc {
        max-width: 50px;
        text-align: center;
      }

      .col-date {
        max-width: 80px;
        font-size: 9px;
      }

      .col-info {
        max-width: 60px;
        font-size: 9px;
        color: #888;
      }

      .loading, .empty, .error {
        text-align: center;
        padding: 20px;
        font-size: 10px;
      }

      .error {
        color: #cc0000;
      }

      @media (max-width: 768px) {
        body {
          padding: 4px;
          font-size: 9px;
        }
        
        table {
          font-size: 9px;
        }
        
        th, td {
          padding: 0px 1px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="back-link">← Back</a>
      <h1>User Admin Dashboard</h1>
      <div class="subtitle">Compact admin table - Maximum data density</div>
    </div>

    <div id="loadingState" class="loading">Loading users...</div>

    <div id="tableContainer" class="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th class="col-user">User</th>
            <th class="col-psw">psw</th>
            <th class="col-mail">mail</th>
            <th class="col-friends">👥</th>
            <th class="col-num">Gpd</th>
            <th class="col-num">#answ</th>
            <th class="col-num">#cor</th>
            <th class="col-perc">%cor</th>
            <th class="col-num">#full</th>
            <th class="col-perc">%full</th>
            <th class="col-num">🔥</th>
            <th class="col-date">Reg</th>
            <th class="col-info">info</th>
            <th class="col-info">info 1</th>
            <th class="col-info">info 2</th>
            <th class="col-info">info 3</th>
            <th class="col-info">info 4</th>
          </tr>
        </thead>
        <tbody id="usersTable">
        </tbody>
      </table>
    </div>

    <div id="emptyState" class="empty" style="display: none;">No users found.</div>
    <div id="errorState" class="error" style="display: none;">
      <span id="errorMessage">Error loading users.</span>
    </div>

    <script>
      async function loadUsers() {
        const loadingState = document.getElementById("loadingState");
        const tableContainer = document.getElementById("tableContainer");
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessage = document.getElementById("errorMessage");
        const usersTable = document.getElementById("usersTable");

        try {
          const response = await fetch("/api/users");
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          const users = await response.json();
          
          loadingState.style.display = "none";
          
          if (users.length === 0) {
            emptyState.style.display = "block";
          } else {
            tableContainer.style.display = "block";
            usersTable.innerHTML = users.map(user => {
              // Calculate derived values
              const gamesPlayed = user.gamesPlayed || 0;
              const totalAnswers = gamesPlayed * 8;
              const correctAnswers = user.correctAnswers || 0;
              const correctPercentage = totalAnswers > 0 ? Math.round((correctAnswers / totalAnswers) * 100) : 0;
              const fullScores = user.fullScores || 0;
              const fullPercentage = gamesPlayed > 0 ? Math.round((fullScores / gamesPlayed) * 100) : 0;
              
              // Format date to YYMMDD
              let regDate = '------';
              if (user.createdAt) {
                try {
                  const date = new Date(user.createdAt);
                  const year = date.getFullYear().toString().slice(-2); // Last 2 digits of year
                  const month = (date.getMonth() + 1).toString().padStart(2, '0'); // Month with leading zero
                  const day = date.getDate().toString().padStart(2, '0'); // Day with leading zero
                  regDate = year + month + day; // YYMMDD format
                } catch (e) {
                  regDate = '------';
                }
              }

              return `
                <tr>
                  <td class="col-id">${user._id ? user._id.slice(-6) : '-'}</td>
                  <td class="col-user">${escapeHtml(user.username || '-')}</td>
                  <td class="col-psw">${escapeHtml(user.plainPassword || '-')}</td>
                  <td class="col-mail">${user.email ? escapeHtml(user.email) : '-'}</td>
                  <td class="col-friends">${user.friends ? user.friends.length : 0}</td>
                  <td class="col-num">${gamesPlayed}</td>
                  <td class="col-num">${totalAnswers}</td>
                  <td class="col-num">${correctAnswers}</td>
                  <td class="col-perc">${correctPercentage}%</td>
                  <td class="col-num">${fullScores}</td>
                  <td class="col-perc">${fullPercentage}%</td>
                  <td class="col-num">${user.bestStreak || 0}</td>
                  <td class="col-date">${regDate}</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                </tr>
              `;
            }).join('');
          }
          
        } catch (error) {
          console.error("Error loading users:", error);
          loadingState.style.display = "none";
          errorState.style.display = "block";
          errorMessage.textContent = error.message;
        }
      }

      function escapeHtml(text) {
        if (!text) return text;
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Load users when page loads
      document.addEventListener("DOMContentLoaded", loadUsers);

      // Auto-refresh every 30 seconds
      setInterval(loadUsers, 30000);
    </script>
  </body>
</html>


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Admin Dashboard – Mimir Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Courier New', Monaco, 'Lucida Console', monospace;
        font-size: 11px;
        line-height: 1.2;
        background: #ffffff;
        color: #000000;
        padding: 8px;
      }

      .header {
        margin-bottom: 12px;
        border-bottom: 1px solid #000;
        padding-bottom: 6px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .header .subtitle {
        font-size: 10px;
        color: #666;
      }

      .back-link {
        color: #0066cc;
        text-decoration: none;
        font-size: 10px;
        margin-bottom: 6px;
        display: inline-block;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .table-container {
        overflow-x: auto;
        border: 1px solid #000;
        max-height: 85vh;
        overflow-y: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        min-width: 800px;
      }

      th {
        background: #f0f0f0;
        border: 1px solid #000;
        padding: 3px 6px;
        text-align: left;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      td {
        border: 1px solid #ccc;
        padding: 2px 6px;
        white-space: nowrap;
        vertical-align: middle;
      }

      tr:nth-child(even) {
        background: #f9f9f9;
      }

      tr:hover {
        background: #e6f3ff;
      }

      .username {
        font-weight: bold;
        min-width: 80px;
      }

      .email {
        min-width: 150px;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        white-space: nowrap;
        min-width: 60px;
      }

      .btn {
        background: none;
        border: 1px solid #666;
        padding: 1px 4px;
        margin: 0 1px;
        cursor: pointer;
        font-size: 9px;
        line-height: 1;
      }

      .btn:hover {
        background: #ddd;
      }

      .btn-delete {
        color: #cc0000;
        border-color: #cc0000;
      }

      .btn-delete:hover {
        background: #ffeeee;
      }

      .btn-edit {
        color: #0066cc;
        border-color: #0066cc;
      }

      .btn-edit:hover {
        background: #eef6ff;
      }

      .loading, .empty, .error {
        text-align: center;
        padding: 20px;
        font-size: 11px;
      }

      .error {
        color: #cc0000;
      }

      .stats-num {
        text-align: right;
        font-family: monospace;
      }

      .user-id {
        font-family: monospace;
        font-size: 9px;
        color: #666;
        max-width: 80px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @media (max-width: 768px) {
        body {
          padding: 4px;
          font-size: 10px;
        }
        
        table {
          font-size: 9px;
        }
        
        th, td {
          padding: 1px 3px;
        }
        
        .btn {
          font-size: 8px;
          padding: 1px 2px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="back-link">← Back</a>
      <h1>User Admin Dashboard</h1>
      <div class="subtitle">Internal admin tool - User data management</div>
    </div>

    <div id="loadingState" class="loading">Loading users...</div>

    <div id="tableContainer" class="table-container" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Friends</th>
            <th>Reg Date</th>
            <th>Quiz Played</th>
            <th>Quiz Score</th>
            <th>Quiz %</th>
            <th>Total Games</th>
            <th>Win Rate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable">
        </tbody>
      </table>
    </div>

    <div id="emptyState" class="empty" style="display: none;">No users found.</div>
    <div id="errorState" class="error" style="display: none;">
      <span id="errorMessage">Error loading users.</span>
    </div>

    <script>
      async function loadUsers() {
        const loadingState = document.getElementById("loadingState");
        const tableContainer = document.getElementById("tableContainer");
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessage = document.getElementById("errorMessage");
        const usersTable = document.getElementById("usersTable");

        try {
          const response = await fetch("/api/users");
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          const users = await response.json();
          
          loadingState.style.display = "none";
          
          if (users.length === 0) {
            emptyState.style.display = "block";
          } else {
            tableContainer.style.display = "block";
            usersTable.innerHTML = users.map(user => `
              <tr>
                <td class="user-id">${user._id ? user._id.slice(-6) : 'N/A'}</td>
                <td class="username">${escapeHtml(user.username)}</td>
                <td class="email">${user.email ? escapeHtml(user.email) : 'N/A'}</td>
                <td class="stats-num">${user.friends ? user.friends.length : 0}</td>
                <td>N/A</td>
                <td class="stats-num">0</td>
                <td class="stats-num">0</td>
                <td class="stats-num">0%</td>
                <td class="stats-num">0</td>
                <td class="stats-num">0%</td>
                <td class="actions">
                  <button class="btn btn-edit" onclick="editUser('${user._id}')" title="Edit">✏️</button>
                  <button class="btn btn-delete" onclick="deleteUser('${user._id}', '${escapeHtml(user.username)}')" title="Delete">🗑️</button>
                </td>
              </tr>
            `).join('');
          }
          
        } catch (error) {
          console.error("Error loading users:", error);
          loadingState.style.display = "none";
          errorState.style.display = "block";
          errorMessage.textContent = error.message;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function editUser(userId) {
        alert(`Edit user functionality coming soon. User ID: ${userId}`);
        // TODO: Implement edit functionality
      }

      function deleteUser(userId, username) {
        if (confirm(`Delete user "${username}"? This action cannot be undone.`)) {
          alert(`Delete functionality coming soon. User ID: ${userId}`);
          // TODO: Implement delete functionality
          // fetch(`/api/users/${userId}`, { method: 'DELETE' })
        }
      }

      // Load users when page loads
      document.addEventListener("DOMContentLoaded", loadUsers);

      // Auto-refresh every 30 seconds
      setInterval(loadUsers, 30000);
    </script>
  </body>
</html>

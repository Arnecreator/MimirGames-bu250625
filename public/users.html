
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Admin Dashboard – Mimir Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", Monaco, "Lucida Console", monospace;
        font-size: 10px;
        line-height: 1;
        background: #ffffff;
        color: #000000;
        padding: 4px;
      }

      .header {
        margin-bottom: 5px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 2px;
      }

      .header h1 {
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .header .subtitle {
        font-size: 9px;
        color: #666;
      }

      .back-link {
        color: #0066cc;
        text-decoration: none;
        font-size: 9px;
        margin-bottom: 5px;
        display: inline-block;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .table-container {
        overflow-x: auto;
        overflow-y: auto;
        border: 1px solid #ccc;
        max-height: 90vh;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        font-family: "Courier New", Monaco, monospace;
      }

      th {
        background: #f5f5f5;
        border: 1px solid #ccc;
        padding: 2px 4px;
        text-align: left;
        font-weight: bold;
        position: sticky;
        top: 0;
        z-index: 10;
        max-width: 100px;
        min-width: 25px;
        line-height: 1;
      }

      td {
        border: 1px solid #ddd;
        padding: 2px 4px;
        text-align: left;
        max-width: 100px;
        min-width: 25px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1;
      }

      tr:nth-child(even) {
        background: #fafafa;
      }

      tr:hover {
        background: #f0f0f0;
      }

      .col-id {
        max-width: 60px;
        font-size: 9px;
        color: #666;
      }

      .col-user {
        max-width: 80px;
        font-weight: bold;
      }

      .col-psw {
        max-width: 70px;
        font-size: 9px;
        color: #666;
      }

      .col-mail {
        max-width: 120px;
        font-size: 9px;
      }

      .col-friends {
        max-width: 40px;
      }

      .col-num {
        max-width: 50px;
        text-align: left;
      }

      .col-perc {
        max-width: 50px;
        text-align: left;
      }

      .col-date {
        max-width: 80px;
        font-size: 9px;
      }

      .col-info {
        max-width: 40px;
        min-width: 25px;
        font-size: 9px;
        color: #888;
        text-align: left;
      }

      .col-actions {
        max-width: 60px;
        min-width: 50px;
        text-align: left;
      }

      .edit-btn,
      .delete-btn {
        background: none;
        border: none;
        font-size: 11px;
        cursor: pointer;
        padding: 1px 2px;
        margin: 0 1px;
        border-radius: 2px;
        transition: background-color 0.2s;
      }

      .edit-btn:hover {
        background: rgba(0, 123, 255, 0.1);
      }

      .delete-btn:hover {
        background: rgba(220, 53, 69, 0.1);
      }

      .loading,
      .empty,
      .error {
        text-align: center;
        padding: 20px;
        font-size: 10px;
      }

      .error {
        color: #cc0000;
      }

      @media (max-width: 768px) {
        body {
          padding: 4px;
          font-size: 9px;
        }

        table {
          font-size: 9px;
        }

        th,
        td {
          padding: 1px 2px;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="back-link" style="margin-right: 8px">🏠</a>
      <a href="javascript:history.back()" class="back-link">← Back</a>
      <h1>User Admin Dashboard</h1>
      <div class="subtitle">Compact admin table - Maximum data density</div>
    </div>

    <div id="loadingState" class="loading">Loading users...</div>

    <div id="tableContainer" class="table-container" style="display: none">
      <table>
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th class="col-user">User</th>
            <th class="col-psw">psw</th>
            <th class="col-mail">mail</th>
            <th class="col-friends">👥</th>
            <th class="col-num">Gpd</th>
            <th class="col-num">#answ</th>
            <th class="col-num">#cor</th>
            <th class="col-perc">%cor</th>
            <th class="col-num">#full</th>
            <th class="col-perc">%full</th>
            <th class="col-num">🔥</th>
            <th class="col-date">Reg</th>
            <th class="col-info">info1</th>
            <th class="col-info">info2</th>
            <th class="col-info">info3</th>
            <th class="col-info">info4</th>
            <th class="col-info">info5</th>
            <th class="col-info">info6</th>
            <th class="col-info">info7</th>
            <th class="col-info">info8</th>
            <th class="col-info">info9</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>

    <div id="emptyState" class="empty" style="display: none">
      No users found.
    </div>
    <div id="errorState" class="error" style="display: none">
      <span id="errorMessage">Error loading users.</span>
    </div>

    <script>
      async function loadUsers() {
        const loadingState = document.getElementById("loadingState");
        const tableContainer = document.getElementById("tableContainer");
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessage = document.getElementById("errorMessage");
        const usersTable = document.getElementById("usersTable");

        try {
          // Use relative URL to work with current domain
          const response = await fetch("/api/users");

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const users = await response.json();
          console.log("Loaded users:", users);

          loadingState.style.display = "none";

          if (users.length === 0) {
            emptyState.style.display = "block";
          } else {
            tableContainer.style.display = "block";
            usersTable.innerHTML = users
              .map((user) => {
                // Calculate derived values
                const gamesPlayed = user.gamesPlayed || 0;
                const totalAnswers = gamesPlayed * 8;
                const correctAnswers = user.correctAnswers || 0;
                const correctPercentage =
                  totalAnswers > 0
                    ? Math.round((correctAnswers / totalAnswers) * 100)
                    : 0;
                const fullScores = user.fullScores || 0;
                const fullPercentage =
                  gamesPlayed > 0
                    ? Math.round((fullScores / gamesPlayed) * 100)
                    : 0;

                // Format date to YYMMDD
                let regDate = "------";
                if (user.createdAt) {
                  try {
                    const date = new Date(user.createdAt);
                    const year = date.getFullYear().toString().slice(-2);
                    const month = (date.getMonth() + 1)
                      .toString()
                      .padStart(2, "0");
                    const day = date.getDate().toString().padStart(2, "0");
                    regDate = year + month + day;
                  } catch (e) {
                    regDate = "------";
                  }
                }

                // Show plaintext password from your auth system (if available)
                const plainPassword = user.plainPassword || "hidden";

                return `
                <tr>
                  <td class="col-id">${user._id ? user._id.slice(-6) : "-"}</td>
                  <td class="col-user">${escapeHtml(user.username || "-")}</td>
                  <td class="col-psw">${escapeHtml(plainPassword)}</td>
                  <td class="col-mail">${user.email ? escapeHtml(user.email) : "-"}</td>
                  <td class="col-friends">${user.friends ? user.friends.length : 0}</td>
                  <td class="col-num">${gamesPlayed}</td>
                  <td class="col-num">${totalAnswers}</td>
                  <td class="col-num">${correctAnswers}</td>
                  <td class="col-perc">${correctPercentage}%</td>
                  <td class="col-num">${fullScores}</td>
                  <td class="col-perc">${fullPercentage}%</td>
                  <td class="col-num">${user.bestStreak || 0}</td>
                  <td class="col-date">${regDate}</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-info">-</td>
                  <td class="col-actions">
                    <button class="edit-btn" onclick="editUser('${user._id}')">📝</button>
                    <button class="delete-btn" onclick="deleteUser('${user._id}')">🗑️</button>
                  </td>
                </tr>
              `;
              })
              .join("");
          }
        } catch (error) {
          console.error("Error loading users:", error);
          loadingState.style.display = "none";
          errorState.style.display = "block";
          errorMessage.textContent = error.message;
        }
      }

      function escapeHtml(text) {
        if (!text) return text;
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Load users when page loads
      document.addEventListener("DOMContentLoaded", loadUsers);

      // Auto-refresh every 30 seconds to show new registrations
      setInterval(loadUsers, 30000);

      // Edit user function
      function editUser(userId) {
        const newData = prompt("Enter new data for this user (JSON format):");
        if (newData && newData.trim()) {
          try {
            const parsedData = JSON.parse(newData);
            console.log("Edit user:", userId, "with data:", parsedData);
            // TODO: Implement API call to update user
            alert("Edit functionality will be implemented soon!");
          } catch (e) {
            alert("Invalid JSON format. Please try again.");
          }
        }
      }

      // Delete user function
      function deleteUser(userId) {
        if (
          confirm(
            "Are you sure you want to delete this user? This action cannot be undone.",
          )
        ) {
          console.log("Delete user:", userId);
          // TODO: Implement API call to delete user
          alert("Delete functionality will be implemented soon!");
        }
      }
    </script>
  </body>
</html>
